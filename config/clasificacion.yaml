      - '\b(educacion|escuela|escuelas|colegio|colegios|docentes?|maestros?|estudiantes|clases|meduca)\b'
      - '\b(policia|delito|delitos|homicidio|homicidios|robo|robos|carcel|carceles|seguridad|operativo|operativos)\b'
    eventos_naturales:
