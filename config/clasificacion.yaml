# E1-07 · Embeddings locales, clasificación temática y baseline (D-03, D-20, D-21, D-57, D-66).
# Todo número y todo patrón vive aquí (D-79). Origen y validación de cada valor: docs/parametros.md,
# sección "Clasificación (E1-07)". Los embeddings son SIEMPRE locales (sentence-transformers, sin API).
version: 1
semilla: 42                 # semilla global (torch, numpy y bootstrap) para que dos corridas den lo mismo
modelo_activo: e5           # D-20 (propuesta): multilingual-e5-small; MiniLM se mide aparte y se elige por macro-F1 con E1-06
metodo_activo: A            # D-21/D-57: A salvo que `python -m eval.clasificacion` demuestre que B es mejor (criterio_ab)
dispositivo: cpu            # CPU: determinista y sin GPU en la máquina de la demo
lote: 32                    # titulares por lote al codificar (no cambia el resultado)
usar_descripcion: true      # si el registro trae descripción del RSS se codifica "titular. descripción"; solo uso interno (D-31)

carpetas:
  modelos: models           # caché de pesos de Hugging Face (ignorada por git); sin internet después de la primera descarga
  embeddings: .cache/embeddings   # caché de embeddings por modelo y revisión (ignorada por git)

# Modelos fijados por id y revisión exacta (hash del commit en Hugging Face, consultado el 2026-10-06).
modelos:
  e5:
    id: intfloat/multilingual-e5-small
    revision: 614241f622f53c4eeff9890bdc4f31cfecc418b3
    prefijo_titular: "query: "      # el titular es la consulta...
    prefijo_tema: "passage: "       # ...y la descripción, los ejemplos y los prototipos de cada tema son los pasajes
    # PROVISIONALES (supuesto): salen de `python -m eval.calibrar_clasificacion` (percentil 5 de la similitud máxima y
    # percentil 25 de la brecha, sobre titulares únicos no ruido del snapshot del 2026-10-06). e5 comprime las
    # similitudes (0.81-0.91): su umbral y su margen son estrechos. Se recalibran con eval/etiquetas.csv (E1-06).
    umbrales:
      A: {umbral_sin_tema: 0.823, margen_secundario: 0.002}
      B: {umbral_sin_tema: 0.794, margen_secundario: 0.004}
  minilm:
    id: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    revision: e8f8c211226b894fcb81acc59f3b34ba3efd5f42
    prefijo_titular: ""
    prefijo_tema: ""
    umbrales:                       # PROVISIONALES: misma regla que arriba (escala de similitud mucho más amplia)
      A: {umbral_sin_tema: 0.221, margen_secundario: 0.032}
      B: {umbral_sin_tema: 0.274, margen_secundario: 0.016}

# Criterio A vs B fijado ANTES de medir (D-21, D-57): B solo si el IC 95 % (bootstrap) de la diferencia de macro-F1
# B − A excluye el cero y ningún tema empeora de forma significativa (IC 95 % de la diferencia de F1 por tema
# enteramente por debajo de cero); si no, A por ser más simple.
criterio_ab:
  remuestreos: 1000
  confianza: 0.95
  semilla: 42

# Baseline por palabras clave (D-66). Las MISMAS categorías que el clasificador: los 6 temas o sin_tema.
# Patrón = expresión regular sobre el titular en minúsculas y sin tildes. Puntaje de un tema = cantidad de patrones
# distintos que coinciden; gana el mayor; si empatan, el primero en el orden de temas.yaml; sin coincidencias, sin_tema.
# Escritas a partir de la columna "Incluye" de docs/guia_temas.md, ANTES de medir y sin mirar los casos difíciles;
# no se ajustan para ganar una medición (el baseline debe ser un comparador honesto, no uno hecho a la medida).
baseline:
  palabras_clave:
    economia:
      - '\binflacion\b'
      - '\b(pib|producto interno)\b'
      - '\b(crecimiento|recesion|economia|economico|economicos|economica|economicas)\b'
      - '\bcanasta basica\b'
      - '\bcombustibles?\b'
      - '\b(desempleo|empleos?|salarios?)\b'
      - '\b(deuda|presupuesto|recaudacion|fiscal|tributari\w*|impuestos?)\b'
      - '\b(inversion|inversiones|inversionistas?)\b'
      - '\b(exportacion|exportaciones|importacion|importaciones|comercio exterior|arancel\w*)\b'
      - '\b(banca|banco|bancos|bancari\w*|depositos?|prestamos?|credito|creditos)\b'
      - '\b(calificadora|calificacion de riesgo|nota de riesgo|grado de inversion)\b'
      - '\b(precio|precios)\b'
    logistica:
      - '\bcanal\b'
      - '\bacp\b'
      - '\b(transito|transitos|calado|esclusas?|neopanamax)\b'
      - '\b(gatun|lago gatun)\b'
      - '\b(puerto|puertos|portuari\w*|contenedor|contenedores|balboa|manzanillo)\b'
