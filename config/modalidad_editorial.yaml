# Modalidad editorial (TVN). Lo único que cambia entre modalidades vive en un YAML como este (D-01).
version: "1.0"
modalidad: editorial
nombre: "Editorial (TVN)"
usuario: "Editora o productor de noticias"

medio_referencia:               # alimenta "¿el medio de referencia ya lo cubrió?"
  nombre: "TVN Panamá"
  dominio: tvn-2.com

# Tabla 3×3 rango × estado de evidencia (D-17). Ninguna acción habilita publicar ni emite alerta definitiva.
# Todo lo que se produce es BORRADOR. Qué se genera por acción: D-42 (docs/salidas.md).
tabla_acciones:
  alto:
    insuficiente: {accion: "Investigar ya", motivo: "Mucha atención potencial pero poco respaldo: conviene verificar antes de redactar."}
    parcial: {accion: "Completar evidencia y producir", motivo: "Atención alta con respaldo parcial: se produce el borrador con los vacíos destacados."}
    suficiente: {accion: "Producir borrador", motivo: "Atención alta y respaldo suficiente."}
  medio:
    insuficiente: {accion: "Vigilar", motivo: "Atención media y poco respaldo: seguir el tema hasta que haya más fuentes."}
    parcial: {accion: "Completar evidencia y producir", motivo: "Atención media con respaldo parcial."}
    suficiente: {accion: "Producir borrador", motivo: "Atención media y respaldo suficiente."}
  bajo:
    insuficiente: {accion: "Archivar", motivo: "Atención baja y poco respaldo."}
    parcial: {accion: "Archivar", motivo: "Atención baja: no justifica completar la evidencia."}
    suficiente: {accion: "Vigilar", motivo: "Bien respaldado pero de atención baja: puede crecer."}

fuentes_sugeridas_extra: []     # sugerencias editoriales adicionales por subtema (D-37); nunca son evidencia
