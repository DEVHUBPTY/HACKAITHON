# E1-03b · Limpieza de titulares y filtro de ruido (src/limpieza.py). Todo patrón, lista o regla vive aquí (D-79).
# Orígenes y validación de cada valor: docs/parametros.md, sección "Limpieza y ruido".
# Los patrones son expresiones regulares y se aplican sobre el texto en minúsculas y SIN tildes (excepto los de
# `limpieza`, que operan sobre el texto original). Marcar, no borrar: nada de lo que sigue elimina un registro.
version: 1

limpieza:
  comillas:                         # comillas tipográficas -> rectas
    "“": '"'
    "”": '"'
    "„": '"'
    "«": '"'
    "»": '"'
    "‘": "'"
    "’": "'"
    "‚": "'"
  # Sufijo del medio (" - La Prensa", " | Medio"): solo se quita si coincide con el nombre o el dominio del medio de
  # la noticia o con un nombre de esta lista; un guion cualquiera NO es sufijo (podría ser parte del titular).
  separadores_sufijo: ["-", "|", "–", "—"]
  max_palabras_sufijo: 6            # un sufijo de medio más largo que esto no se corta
  min_letras_medio: 5               # nombres de medio más cortos que esto no se comparan por contención ("AP", "ABC")
  medios_conocidos: ["Xinhua", "Noticias Prensa Latina", "Prensa Latina", "Dominican Today", "Honolulu Star - Advertiser",
                     "Global Finance Magazine", "Cruise Industry News", "EFE", "AFP", "Reuters", "Europa Press"]
  # Tokenización de GDELT ("21 , 2 %", "US$84 . 000", "¿ Cómo ?") y barra pegada de TVN ("resultados| texto").
  # Pares [patrón, reemplazo] aplicados en orden sobre el texto original.
  reemplazos:
    - ['(?<=\w) \. (?=(?:com|net|org|co|ar|pa|info|gob|edu)\b)', '.']    # "newsroomamerica . com" -> "newsroomamerica.com"
    - ['(?<=\d)\s*([.,])\s*(?=\d)', '\1']       # "21 , 2" -> "21,2"; "84 . 000" -> "84.000"
    - ['\s+([,.;:?!%)\]])', '\1']                 # "cierra , luego" -> "cierra, luego"
    - ['([¿¡(\[])\s+', '\1']                       # "¿ Cómo" -> "¿Cómo"
    - ['(?<=\w)\|\s*', ' | ']                      # "resultados| Panamá" -> "resultados | Panamá"

# Titulares que no son noticias: sin contenido, el nombre del medio, promociones y categorías/URL de ítems que no son notas.
no_noticia:
  titulo_generico:
    - '^\s*[\w.\- ]+\s*\.\s*(com|net|org|co|ar|pa|info)\s*$'    # solo un dominio ("newsroomamerica . com")
    - '^\s*(inicio|preview|home)\b'
  titulo_promocional:
    - '^\s*(suscribete|suscribase|descarga la app)\b'
    - '\bsorteo (semanal|mensual|diario)\b'
  titulo_igual_al_medio: true       # el titular es solo el nombre o el dominio del medio ("Dominican Today")
  patrones_url:
    - '/(promociones|promocion|sorteos?|publicidad|clasificados|horoscopo|newsletter|boletin|suscripcion)(/|$)'
  categorias_rss: [promociones, publicidad, clasificados, horoscopo]    # categoria_fuente, sin tildes ni mayúsculas

# No es Panamá: ni trata ni afecta a Panamá. El titular decide; la sección del RSS solo hace sospechosa la nota.
panama:
  # Falsos Panamá (aplican a todo origen): ciudad de Florida, Panama Papers como referencia, sombreros.
  falsos:
    - '\bpanama city\b'
    - '\bpcb\b'
    - '\bpanama papers\b'
    - '\bsombreros? panam\w*'
  # Menciones de Panamá o de lo que lo afecta directamente (Canal, Darién, instituciones). Una nota de otro país que
  # nombra algo de esto NO es ruido (migración por el Darién, decisiones sobre el Canal).
  menciones:
    - '\bpanam\w*'
    - '\bcanal de panam\w*'
    - '\bacp\b'
    - '\bdarien\b'
    - '\bzona libre\b'
    - '\b(colon|chiriqui|veraguas|cocle|bocas del toro|san miguelito|tocumen|la chorrera|gatun)\b'
    - '\b(mulino|minsa|css|asep|mef|mibus)\b'
  # La nota está SUJETA al filtro de mención (se marca si no hay mención) cuando:
  origenes_sujetos: [GDELT]         # las consultas de GDELT piden "Panama" más un término amplio sin anclarlo al titular
  origenes_exentos: ["TVN RSS"]     # un registro que también viene del RSS de TVN no se filtra por origen
  paises_medio_exentos: ["Panamá"]  # medios panameños: sus notas son sobre Panamá aunque el titular no lo diga
  # TVN: la primera sección de la URL es solo una señal CANDIDATA; con un titular sin mención se marca.
  dominio_con_seccion: tvn-2.com
  # D-84: una nota que nombra la región (o su comercio/logística) NO es ruido: se conserva con
  # alcance_regional = true y se cuenta aparte en el reporte. Un falso Panamá o un deporte siguen siendo ruido.
  regionales:
    - '\b(centroamerica|central america|america central|america latina|latinoamerica\w*|latam|latin america|latin amerika|lateinamerika)\b'
    - '\blatinske ameriky\b|\bлатинск\w* америк\w*|\bлатинськ\w* америц\w*'   # checo, ruso, ucraniano
    # "Caribe" a secas no basta ("Caribbean cricket"): solo junto a un término económico, logístico o marítimo.
    - '\b(caribe|caribbean)\b.{0,60}\b(econom\w*|comerci\w*|trade|puertos?|ports?|maritim\w*|shipping|carga|cargo|logistic\w*|cruceros?|cruise\w*|buques?|navier\w*)\b'
    - '\b(econom\w*|comerci\w*|trade|puertos?|ports?|maritim\w*|shipping|carga|cargo|logistic\w*|cruceros?|cruise\w*|buques?|navier\w*)\b.{0,60}\b(caribe|caribbean)\b'
    # E1-10c (X44, acotado por X54): comercio marítimo o de combustibles en una ruta que pasa por el Canal (D-84: «rutas
    # marítimas»). Exige DOS cosas: (1) el flujo: transporte de mercancías por mar, o exportación/importación de combustibles
    # (a ≤ 40 caracteres); y (2) un ancla de D-84: un canal interoceánico, una «ruta marítima/comercial», o la ruta Asia–EE. UU.
    # (la principal del Canal). X59: la ruta Asia–EE. UU. exige un nombre inequívoco de EE. UU. (EE. UU., Estados Unidos, U.S., USA) junto a un
    # término asiático, o una ruta explícita («from China to US», «Asia-US», «entre Asia y…»); el «US» solo cuenta si abre el titular y
    # califica un flujo («US crude exports…»), nunca como el pronombre inglés («…as US sanctions…», «…, US analysts say»). Sin ancla sigue siendo ruido: cocaína en contenedores en Rotterdam, combustible de la India.
    # Panamá, la región y el Caribe ya cuentan por las reglas de arriba.
    - &comercio_maritimo_x44 '^(?=.*(?:\b(?:carga contenerizada|contenedores|portacontenedores|containers?|container shipping|navieras?|shipping lines?|fletes? maritim\w*|freight rates?|transporte maritimo|comercio maritimo|maritime trade|cargoes)\b|\b(?:diesel|gasolinas?|combustibles?|fuel|gnl|lng|gas natural licuado|crudo|crude)\b.{0,40}\b(?:export\w*|import\w*)\b|\b(?:export\w*|import\w*)\b.{0,40}\b(?:diesel|gasolinas?|combustibles?|fuel|gnl|lng|gas natural licuado|crudo|crude)\b))(?:(?=.*\b(?:canal de (?:panama|suez)|panama canal|suez canal|canal interoceanico|rutas? maritim\w*|rutas? comercial\w*|shipping routes?|trade routes?)\b)|(?:(?=.*\b(?:asia\w*|chin[ao]s?|chinese|japon\w*|japan\w*|corea\w*|korea\w*)\b)(?=.*(?:(?:\b(?:ee\.?\s?uu|eeuu|estados unidos|estadounidense\w*|usa)\b|\bu\.s\.)|(?:^|\bthe\s+)us\s+(?:\w+\s+){0,2}(?:export\w*|import\w*|shipments?|cargo\w*|exportaciones|importaciones|embarques)\b))|(?=.*\b(?:from|desde|de)\s+(?:asia\w*|chin[ao]s?|chinese|japon\w*|japan\w*|corea\w*|korea\w*)\b.{0,30}\b(?:to|a|hacia|para)\s+(?:the\s+)?(?:(?:ee\.?\s?uu|eeuu|estados unidos|estadounidense\w*|usa|us)\b|u\.s\.))|(?=.*\b(?:from|desde|de)\s+(?:the\s+)?(?:(?:ee\.?\s?uu|eeuu|estados unidos|estadounidense\w*|usa|us)\b|u\.s\.).{0,30}\b(?:to|a|hacia|para)\s+(?:asia\w*|chin[ao]s?|chinese|japon\w*|japan\w*|corea\w*|korea\w*)\b)|(?=.*\b(?:asia\w*|chin[ao]s?|chinese|japon\w*|japan\w*|corea\w*|korea\w*)\s*[-/–—]\s*(?:(?:ee\.?\s?uu|eeuu|estados unidos|estadounidense\w*|usa|us)\b|u\.s\.))(?=.*)|(?=.*\b(?:ee\.?\s?uu|eeuu|estados unidos|estadounidense\w*|u\.s\.|usa|us)\s*[-/–—]\s*(?:asia\w*|chin[ao]s?|chinese|japon\w*|japan\w*|corea\w*|korea\w*)\b)|(?=.*\bentre\s+(?:asia\w*|chin[ao]s?|chinese|japon\w*|japan\w*|corea\w*|korea\w*)\b.{0,30}\by\s+(?:los\s+)?(?:(?:ee\.?\s?uu|eeuu|estados unidos|estadounidense\w*|usa|us)\b|u\.s\.))|(?=.*\bbetween\s+(?:asia\w*|chin[ao]s?|chinese|japon\w*|japan\w*|corea\w*|korea\w*)\b.{0,30}\band\s+(?:the\s+)?(?:(?:ee\.?\s?uu|eeuu|estados unidos|estadounidense\w*|usa|us)\b|u\.s\.))|(?=.*\btranspacific\w*)))'
  # D-120: la excepción regional (D-84) exige evidencia de impacto en Panamá. Una nota regional de un medio NO panameño
  # (ver `paises_medio_exentos` y `origenes_exentos`), que no nombra a Panamá (`menciones`) y que no trae un fenómeno
  # regional con impacto en Panamá (esta lista) se marca `no_es_panama`: la guía dice que una nota regional que no afecta a
  # Panamá «sigue siendo no_es_panama». Ejemplo: las copias sindicadas de «Trump streicht Europa-Hilfe, lenkt Millionen
  # nach Lateinamerika». Un fenómeno de esta lista conserva la excepción (alcance_regional = true, no es ruido).
  # Fenómenos de la guía (D-84): El Niño/La Niña, rutas marítimas (y su comercio: carga, contenedores, navieras, combustibles
  # por mar) y migración por el Darién. Texto sin tildes y en minúsculas (se compara contra `plano(titular)`).
  fenomenos_regionales_con_impacto:
    - '\b(el nino|la nina|enso)\b'
    - '\b(rutas? maritim\w*|shipping routes?|trade routes?|maritim\w*|shipping|carga contenerizada|contenedores|containers?|navieras?|cargoes|cargo)\b'
    - *comercio_maritimo_x44   # X44: comercio marítimo o de combustibles con ancla de ruta (rutas marítimas, Canal, Asia–EE. UU.)
    - '\b(migracion|migrantes?|migration|migrants?|darien)\b'
  secciones_dudosas: [mundo, tvmax, entretenimiento, tu-cara-me-suena]   # D-126: tu-cara-me-suena es la sección del programa de TVN (farándula). gente-tvn y videos son contenido propio de TVN: no se filtran por sección

# Es de Panamá, pero de un área que el reto no cubre (docs/guia_temas.md): deportes, farándula, cultura, política partidista.
fuera_de_temas:
  deportes:
    - '\bf[uú]tbol\b'
    - '\bselecci[oó]n (de f|nacional|mayor|argentina|colombia)\w*'
    - '\b(mlb|playoffs?|torneo|amistoso|goleador|golea\w*|basquet|beisbol|liga de naciones|liga panamena|lpf)\b'
    - '\b(automovilismo|formula [1-4]|indycar|nascar|karting|motorsport\w*)\b|\bpilotos?\b.{0,60}\b(carreras?|campeonato|escuderia|circuito)\b'   # D-126: piloto de carreras, nunca un piloto de avión
    - '\bcopa (del mundo|america|oro|kirin|concacaf|libertadores|sudamericana|davis|mundial)\b'   # no "Copa Airlines"
    - '\b(mundial (de|sub|femenino|masculino)|(al|el|del|para el|en el) mundial)\b'            # no "Banco Mundial"
    - '\b(eliminatorias|semifinales?)\b'
    - '\bpartido (ante|amistoso|de (futbol|beisbol|baloncesto|ida|vuelta))\b'                  # no "partido de gobierno"
  farandula:
    - '\b(videoclip|vida sentimental|carnavalera|famos[oa]s?|music awards)\b'
    - '\b(cantante|actriz|actor)\b.{0,50}\b(estrena\w*|lanza\w*|nuevo (album|sencillo|papel)|protagoniza\w*|revela\w* detalles|gira)\b'   # no "cantante denuncia agresión"
    - "\\bgira (musical|mundial|de conciertos)\\b|\\bgira '"                                      # no "Mulino gira instrucciones"
    - '\b(kardashian|lohan|pedro pascal|offset)\b'
    - '\bconcierto\b(?! benefic| solidari)'                                                     # no "concierto benéfico"
    - '\b(shows?|reality|tu cara me suena|concursantes?)\b'                                    # D-126: espectáculo y concursos de TV («el octavo show de Tu Cara Me Suena»); palabra completa
  cultura:
    - '\bferia del libro\b'
    - '\bfestival (de|internacional de) (cine|jazz|musica|teatro)\b'
  politica_partidista:
    - '\bprimarias?\b'
    - '\bcampana electoral\b'
    - '\bcandidat[oa]s? presidencial(es)?\b'                  # no "candidato a contralor" (cargo no partidista)
  # D-126: pronunciamiento sobre un hecho de OTRO país, sin efecto declarado en Panamá (diplomacia, no los 6 temas).
  # Cada patrón se anula si el titular nombra algo que sí toca a Panamá (Canal, buques, panameños, migrantes, comercio).
  politica_internacional:
    - '^(?!.*\b(canal|buques?|barcos?|panamenos?|panamenas?|connacionales?|migrantes?|darien|comercio|aranceles?|sanciones?|economia)\b)(?=.*\b(condena\w*|repudia\w*|lamenta\w*|rechaza\w*)\b).*\b(atentados?|terroris\w*|guerra|bombardeos?|invasion)\b'
    - '^(?!.*\b(canal|buques?|barcos?|panamenos?|panamenas?|connacionales?|migrantes?|darien|comercio|aranceles?|sanciones?|economia)\b).*\bpid(e|en|io)\b.{0,20}\bpaz\b'
  # D-126: se aplican SOLO en una sección dudosa de TVN (señal candidata, como `deportes`/`farandula` allí). «piloto» a secas es
  # un piloto de carreras en tvmax/entretenimiento; un piloto de avión (aeropuerto, aerolínea, vuelo) no cuenta.
  solo_en_seccion_dudosa:
    - '^(?!.*\b(aeropuerto|aerolineas?|aviones?|aviacion|aeronaves?|vuelos?|helicopteros?|tocumen|aereo|aerea|aeronautic\w*)\b).*\bpilotos?\b'

  # Autopromoción de TVN (H5): no es noticia de los temas. "Contenido Exclusivo: ..." sí puede estarlo y no se marca.
  autopromocion_tvn:
    - '^\s*(tvn media|gente tvn|gente que inspira)\b(?!.*\b(inundacion\w*|donacion\w*|damnificad\w*|emergencia|ayuda humanitaria|incendio\w*|tragedia|sismo|lluvias?)\b)'

# D-126: un titular que el clasificador deja sin tema (similitud máxima bajo `umbral_sin_tema`) no es de ninguno de los 6 temas del
# reto: se marca ruido `fuera_de_temas` (no se borra) y no entra a grupos ni a la bandeja. Lo aplica src/clasificacion.py.
sin_tema_como_ruido:
  activo: true

# Prototipo de noticia sobre Panamá (similitud de embeddings; diferido desde E1-03b en la revisión X14; implementado en E1-07 en src/clasificacion.py).
# Con el modelo de clasificacion.yaml (modelo_activo): un titular que no está marcado como ruido ni como alcance
# regional y cuya similitud MÁXIMA con estos prototipos es menor que `umbral` se marca no_es_panama (motivo
# "no_es_panama", columna ruido_similitud = true). Una nota regional NO se marca nunca por esta vía.
# `activo: false` hasta medir su precisión y recall con `python -m eval.ruido` contra eval/etiquetas.csv (E1-06):
# sin etiquetas humanas el umbral no está calibrado (docs/parametros.md).
similitud_prototipo:
  activo: false
  umbral: 0.774     # sugerido para e5: percentil 5 de la similitud de los titulares únicos no ruido (eval.calibrar_clasificacion); SIN calibrar con etiquetas
  prototipos:
    - "Noticias de Panamá: el gobierno panameño anuncia una medida"
    - "El Canal de Panamá, los puertos y la economía panameña"
    - "Panama news: Panamanian government, economy and Canal"
