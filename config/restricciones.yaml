# Restricciones de las salidas (D-25, D-51, docs/salidas.md). La leyenda de alcance no cuenta para los límites de
# palabras y el validador no la revisa contra las frases prohibidas.
# Cada modalidad declara en `grupos_restricciones` qué grupos le aplican (sin `if modalidad` en el código).
version: "1.0"

marca_borrador: "BORRADOR · requiere revisión"
marcador_visual: "[VISUAL: a definir por producción]"
aviso_banca: "No constituye recomendación financiera ni opinión oficial de la SBP."

leyendas_alcance:
  titular_metadatos: "basado únicamente en titular/metadatos"
  con_descripcion: "basado en titular, descripción del RSS y metadatos; no se leyó el artículo completo"

# Comparación sin tildes ni mayúsculas. Se rechazan salvo que estén literalmente en un titular citado como declaración.
grupos:
  comunes:                          # toda modalidad
    lectura_simulada: ["según el artículo", "el artículo completo detalla", "al leer la nota", "en el cuerpo de la nota", "tras leer el artículo", "como explica la nota",
                       "el artículo señala", "según la nota", "el reportaje detalla", "en el texto se indica", "de acuerdo con el artículo",
                       "el artículo explica", "la nota detalla", "según el reportaje", "el texto indica", "la noticia explica"]
    sensacionalistas: [escándalo, bombazo, impactante, alarmante, increíble, aterrador, caos, brutal, explosivo, devastador, urgente]
  editorial:                        # docs/salidas.md §1: PDF prohíbe inventar entrevistas e imágenes
    entrevistas: ["en entrevista con", "declaró a este medio", "consultado por", "en conversación con", "dijo a este medio", "en declaraciones exclusivas", "habló con este medio"]
    imagenes: ["en estas imágenes", "como vemos", "las imágenes muestran", "en el video se ve", "como se aprecia en la foto"]
  banca:                            # docs/salidas.md §2: PDF prohíbe recomendar, inferir pérdidas y alertas definitivas
    recomendacion: ["comprar", "vender", "invertir", "recomendamos", "conviene", "se recomienda", "recomendable", "aconsejamos", "aconsejable",
                    "es aconsejable", "sugerimos", "sugiere", "sugieren", "se sugiere",
                    # X62: formas condicionales e impersonales de recomendar («habría que + verbo» es un patrón de validador.yaml, X67); «sería/podría ser oportuno…» va como patrón en validador.yaml
                    "convendría", "lo prudente sería", "lo oportuno sería", "lo recomendable sería", "lo aconsejable sería",
                    "lo mejor sería", "es conveniente", "es oportuno", "es prudente"]   # X50; «deberían reducir…» va como patrón en validador.yaml
    certeza: ["ocurrirá", "sin duda", "inevitable", "con certeza", "con seguridad", "con toda seguridad", "es seguro que", "sin lugar a dudas",
              "seguramente", "definitivamente", "indudablemente",                    # X50
              # X62: la evidencia no vuelve evidente ni «un hecho» una hipótesis de impacto
              "es evidente que", "es un hecho que", "es claro que", "está claro que", "es obvio que", "es indudable", "es innegable",
              "es indiscutible", "es incuestionable", "no cabe duda", "sin ninguna duda", "queda demostrado", "está demostrado"]
    # X50: futuro indicativo que afirma un efecto (se compara con tildes: «bajará» sí, «bajara» no). Solo inferencias e hipótesis.
    futuro_asertivo: ["caerá", "caerán", "subirá", "subirán", "bajará", "bajarán", "aumentará", "aumentarán", "disminuirá", "disminuirán",
                      "afectará", "afectarán", "generará", "generarán", "reducirá", "reducirán", "crecerá", "crecerán", "empeorará", "empeorarán",
                      "mejorará", "mejorarán", "provocará", "provocarán", "causará", "causarán", "impactará", "impactarán",
                      # X62: lista CERRADA (supuesto); el patrón general de validador.yaml cubre el resto de los futuros simples
                      "se desplomará", "se desplomarán", "sufrirá", "sufrirán", "perderá", "perderán", "se hundirá", "se hundirán",
                      "se deteriorará", "se deteriorarán", "se agravará", "se agravarán", "colapsará", "colapsarán", "se encarecerá", "se encarecerán"]
    # D-54 (E2-02): se compara por palabra completa, así que van el singular y el plural. Rechazado en todo tipo salvo en una declaración
    # que lo trae literal en su titular (validador.yaml · listas).
    perdidas_en_inferencias: ["pérdida", "pérdidas", "impago", "impagos", "morosidad", "exposición", "exposiciones", "cartera", "carteras",
                              "default", "riesgo de crédito", "riesgos de crédito", "score", "scores",
                              # X50: CLAUDE.md nombra solvencia y riesgo de crédito; paráfrasis directas
                              "riesgo crediticio", "riesgos crediticios", "solvencia", "insolvencia", "insolvente", "insolventes", "mora",
                              "moroso", "morosos", "morosa", "morosas", "incumplimiento", "incumplimientos", "deterioro crediticio",
                              "deterioros crediticios"]

# D-69 · Posible inyección en titulares y descripciones (E1-03b). Patrones de instrucción; regex sobre el texto en
# minúsculas y sin tildes. Una coincidencia marca `sospechoso_inyeccion = true`: el registro no se borra ni se excluye,
# y la ficha muestra una advertencia al revisor. El texto sigue siendo dato, nunca instrucción.
inyeccion:
  patrones:
    - '\b(ignora|ignorar|ignore|olvida|disregard|forget)\b.{0,40}\b(instrucciones|reglas|instructions|rules)\b'
    - '\b(todas )?las instrucciones anteriores\b'
    - '\b(previous|prior|above) instructions\b'
    - '\b(prompt del sistema|system prompt|instrucciones internas|hidden instructions|tus instrucciones)\b'
    - '\b(muestra|imprime|revela|reveal|print|show)\b.{0,40}\b(prompt|claves|credenciales|secret|secreto|credentials|instrucciones)\b'
    - '\b(a partir de ahora|from now on|nuevas? reglas?|new rules?|you are now|ahora eres)\b'
    - '\b(unrestricted mode|modo sin restricciones)\b'
    - '\b(inventar|invent) (cifras|figures|datos)\b'
    - '\b(no cites|sin citas|skip citations|sin revision humana|skip the human review|human review step)\b'
    - '\b(publica|publicalo|publicala|publish)\b.{0,40}\b(ahora|ya|inmediatamente|de inmediato|immediately|now)\b'
    - '\b(marca|mark)\b.{0,40}\b(aprobad[ao]|approved)\b'
    - '\b(responde solo con|respond only with)\b'
