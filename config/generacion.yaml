# E1-12 · Generación del paquete editorial (D-41 a D-45, D-67). Todo número y toda lista viven aquí (D-79).
# Origen y validación de cada valor: docs/parametros.md, sección "Generación del borrador (E1-12)".
version: "1.0"

prompts:
  afirmaciones: afirmaciones_ficha     # paso 1 (prompts/afirmaciones_ficha.txt)
  redaccion: paquete_editorial         # paso 2, un bloque por grupo (prompts/paquete_editorial.txt)
  # Paquetes con prompt propio (E2-02): un solo archivo versionado con los dos pasos, en bloques `## afirmaciones` (paso 1),
  # `## comunes` y `## grupo <nombre>` (paso 2). Los paquetes que no están aquí usan los dos de arriba.
  paquetes:
    boletin: boletin_banca             # prompts/boletin_banca.txt

# Un reintento ante salida inválida (JSON que no cumple el esquema o sección que no pasa la validación). Si el reintento
# tampoco sirve, la sección se entrega vacía con el motivo en `vacios`; nunca se rellena.
reintentos: 1

afirmaciones:
  minimas_validas: 1       # sin al menos una afirmación válida no se redacta nada
  maximas: 8               # el LLM puede proponer más; se conservan las primeras
  exigir_inferencia: true  # el enfoque se apoya en una inferencia o hipótesis (D-41): si ninguna sobrevive a la validación se reintenta una vez con el motivo (E1-13)

# Qué se genera según la acción de la ficha (D-42). Acción fuera de estas listas: no se genera nada y se avisa.
# `completo` es el paquete completo de la modalidad (tabla `modalidades`): el editorial o el boletín de entorno. Las acciones son las
# de la tabla 3×3 de cada modalidad (modalidad_<m>.yaml). Banca (E2-02): «Incluir…» genera el boletín; «Incluir como señal a confirmar»
# lo genera con los vacíos de la ficha a la vista; «Seguimiento» y «Seguimiento prioritario» no generan boletín: Decisión D-104 (del
# dueño; la persona puede forzarlo y queda registrado).
acciones:
  completo: ["Producir borrador", "Borrador opcional", "Incluir en el boletín como observación", "Incluir como contexto"]
  completo_con_vacios: ["Completar evidencia y producir", "Incluir como señal a confirmar"]
  investigacion: ["Investigar ya", "Vigilar"]
  nada: ["Archivar", "Archivar como contexto", "Seguimiento prioritario", "Seguimiento"]

# Qué prefijo de ID respalda un hecho (dato oficial o conteo)  y cuál es lo que reporta un medio (CLAUDE.md, D-63). `SYN-` son casos sintéticos.
prefijos:
  hecho_oficial: ["IND-", "SIS-", "SBP-"]   # un hecho puede citar solo datos oficiales…
  hecho_conteo: ["GRP-"]                    # …o el conteo del grupo (campos de `campos_conteo`); nunca un titular (D-18, D-68, X28)
  reportes: ["NOT-", "SYN-"]                # lo que reporta un medio: declaración

campos_conteo: [n_titulares, n_medios, n_procedencias]

# Un dato oficial anual no se describe con estas palabras (CLAUDE.md: «actual», «hoy»), comparadas sin tildes y como palabra completa.
volatiles: [actual, actualmente, hoy, en la actualidad, a la fecha, en este momento, vigente, este año, recientemente, ayer]
# Cada dato de una línea de la ficha viene como «PAÍS AAAA: valor unidad»; se toma el valor de cada uno (separados por «;»).
patron_valor_por_anio: '[A-Z]{3} \d{4}: ([^;]+)'
# El año de un ID anual (IND-PAN-FP.CPI.TOTL.ZG-2024) es el último grupo de dígitos tras el guion; se exige en el texto.
patron_anio_en_id: '-(\d{4})$'

# Un título o titular basado en una declaración lleva atribución: el nombre del medio o alguno de estos verbos (palabra completa).
atribucion:
  marcadores: [reporta, reportan, reportó, reportaron, reportado, informa, informan, informó, informaron, según, señala, señalan,
               señaló, indica, indican, publica, publican, publicó, afirma, afirman]

traducido:                 # D-45: la cita de un titular que no está en este idioma lleva la marca
  idioma_base: es
  marca: "(traducido)"

# El texto de salida no puede repetir fragmentos del system prompt (T07): n palabras consecutivas iguales lo delatan.
fuga_prompt:
  palabras_por_fragmento: 6

objetivo_fraccion_limite: 0.8   # el aviso del reintento pide quedar en esta fracción del máximo de palabras (supuesto)

# Si tras el reintento una de estas secciones solo falla por superar el máximo de palabras, se quitan oraciones del final
# (nunca se reescribe ni se agrega nada) hasta que cabe, y se deja constancia en `vacios`. Es un supuesto nuestro:
# los máximos de brief (250) y copy (80) son del PDF y no se relajan.
recortables: [brief, resumen_web, copy_digital]

texto:                     # recortes de los mensajes de error y de descarte (no de la salida)
  motivo_max_caracteres: 600
  vista_previa_caracteres: 60

# Modalidades con generación implementada y su paquete completo (docs/salidas.md): editorial (§1) o boletín de entorno (§2, E2-02).
# Una modalidad fuera de esta tabla no genera nada. No hay ningún `if modalidad` en el código: la diferencia está aquí.
modalidades:
  editorial: editorial
  banca: boletin

grupos:                    # D-44: 1 llamada de afirmaciones + 4 de redacción, cada una bajo demanda
  editorial: [titulos, brief, guion, resumen]
  investigacion: [investigacion]
  boletin: [boletin]       # E2-02: 1 llamada de afirmaciones + 1 de redacción (observaciones, hipótesis de impacto y preguntas)

# E2-02 · Boletín de entorno (docs/salidas.md §2). Los campos de origen «Regla» se arman con estos textos, sin LLM.
boletin:
  motivo_sector:           # {tema}: nombre del tema (temas.yaml); {sector}: sector del mapeo tema → sector (modalidad_banca.yaml, D-11)
    principal: "Tema principal del grupo, {tema}: se relaciona con el sector {sector} según el mapeo tema → sector (D-11)."
    secundario: "Tema secundario del grupo, {tema}: se relaciona con el sector {sector} según el mapeo tema → sector (D-11)."
  sin_sector: "El grupo no tiene un tema con sector en el mapeo tema → sector: no se asigna ningún sector (nunca se inventa uno)."

deepseek:                  # respaldo provisional de pago (D-80); la clave sale de local.env (DEEPSEEK_API_KEY)
  base_url: "https://api.deepseek.com"
  modelo: "deepseek-flash"      # modelo documentado en api-docs.deepseek.com (2026-10-06); DEEPSEEK_MODEL de local.env lo sobrescribe
  timeout_segundos: 120
  max_tokens: 1536
  precio_usd_por_millon_tokens:
    entrada: 0.30     # USD por millón, deepseek-flash, entrada sin caché, tarifa PICO (la off-peak es 0.15); conservador
    salida: 1.20      # tarifa pico (off-peak 0.60)

tope_costo:                # D-67, D-95, D-98 (solo guarda contra un bucle descontrolado; el límite real es el saldo de la cuenta): al alcanzarlo la generación se detiene con TopeDeCostoAlcanzado (sin respaldo local)
  tokens: 200000000
  usd: 100.00
  registro: outputs/costo_llm.json   # acumulado entre ejecuciones (fuera de git)

medicion:                  # scripts/medir_generacion.py: latencia de la primera respuesta y del paquete completo
  repeticiones: 5
  calentamiento: 1         # llamadas previas que NO entran en las estadísticas (carga del modelo en frío)
  percentil: 95
