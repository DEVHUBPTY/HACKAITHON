banco_mundial:
  base_url: "https://api.worldbank.org/v2"
  paises: [PAN, CRI, COL, DOM, MEX, GTM]
  anio_inicio: 2010
  anio_fin: 2024
  per_page: 1000
  # El PDF declara 1.350 combinaciones, pero 6 países × 6 indicadores × 15 años = 540 (ver manifest).
  cuadricula_declarada_en_pdf: 1350
  licencia: "CC BY 4.0 (excepciones de terceros por indicador: pendiente de verificar)"
  carpeta_cruda: banco_mundial
  pausa_segundos: 1
  indicadores:
    NY.GDP.MKTP.KD.ZG: {nombre: "Crecimiento del PIB", unidad: "% anual"}
    FP.CPI.TOTL.ZG: {nombre: "Inflación (precios al consumidor)", unidad: "% anual"}
    SL.UEM.TOTL.ZS: {nombre: "Desempleo", unidad: "% de la fuerza laboral"}
    SP.POP.TOTL: {nombre: "Población total", unidad: "personas"}
    IT.NET.USER.ZS: {nombre: "Uso de internet", unidad: "% de la población"}
    NE.EXP.GNFS.ZS: {nombre: "Exportaciones de bienes y servicios", unidad: "% del PIB"}

usgs:
  endpoint: "https://earthquake.usgs.gov/fdsnws/event/1/query"
  formato: geojson
  # endtime es exclusivo a la hora indicada: se pide hasta el último segundo del 31/12/2024.
  starttime: "2024-01-01T00:00:00"
  endtime: "2024-12-31T23:59:59"
  minlatitude: 5
  maxlatitude: 12
  minlongitude: -86
  maxlongitude: -76
  minmagnitude: 3
  orderby: time-asc
  licencia: "Dominio público de USGS; condiciones de elementos de terceros: pendiente de verificar"
  carpeta_cruda: usgs
