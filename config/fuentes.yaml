# Receta de extracción del snapshot (E0-04, D-24, D-74).
# Todo número de este archivo está registrado en docs/parametros.md.

general:
  agente_http: "HackIAthon-extraccion/1.0 (metadatos; uso academico)"
  timeout_segundos: 60
  reintentos: 3
  espera_reintento_segundos: 15
  alcance_texto: "basado únicamente en titular/metadatos"
  idioma_por_defecto: es

ventana_noticias:
  # D-74: 30 días previos a la extracción; se amplía hasta 90 si no se alcanza el mínimo.
  dias_base: 30
  dias_maximo: 90
  base_de_medicion: fecha_deteccion   # si falta (RSS sin GDELT), fecha_publicacion
  # El intervalo [2024-01-01, 2025-10-01) de la sección 7 del PDF NO se aplica (D-74).
  intervalo_pdf_seccion_7_no_aplicado: ["2024-01-01", "2025-10-01"]

volumen_noticias:
  meta: 200
  minimo: 100
  minimo_tvn: 20

medios_conocidos:
  tvn-2.com:
    nombre: "TVN Panamá"
    pais: "Panamá"
    condiciones: >-
      Feed RSS público; que sea público no implica licencia abierta sobre artículos, videos o
      imágenes. Solo metadatos; la descripción del RSS es de uso interno y no se guarda en el
      repositorio (D-31, D-72).
medio_tvn_dominio: tvn-2.com

url_canonica:
  esquema: https
  quitar_prefijo_www: true
  parametros_a_quitar: [fbclid, gclid, igshid, mc_cid, mc_eid, ref, ref_src, "utm_*"]

rss_tvn:
  # URL tomada del hipervínculo de la referencia [2] del PDF del reto.
  url: "https://www.tvn-2.com/rss/"
  carpeta_cruda: rss_tvn
  # El RSS no trae categoría: el tema de origen es la primera sección de la ruta de la URL.
  tema_desde: primera_seccion_de_la_url

gdelt:
  endpoint: "https://api.gdeltproject.org/api/v2/doc/doc"
  modo: ArtList
  formato: json
  orden: DateDesc
  maxrecords: 250
  pausa_segundos: 12           # GDELT pide ~1 solicitud cada 5 s; con 6 s respondió 429 sostenidos
  espera_429_segundos: 60
  rango_dias: 5                # tamaño inicial de cada rango de fechas
  rango_minimo_horas: 6        # límite al subdividir cuando una consulta llega al tope
  carpeta_cruda: gdelt
  idiomas:
    Spanish: es
    English: en
    Portuguese: pt
    French: fr
    German: de
    Italian: it
    Chinese: zh
  # Tema de origen = clave. 'Panama' combinado con términos en español e inglés.
  consultas:
    logistica: 'Panama (logistica OR logistics OR puerto OR port OR shipping OR canal OR cargo)'
    turismo: 'Panama (turismo OR tourism OR turistas OR tourists OR hotel OR cruceros)'
    economia: 'Panama (economia OR economy OR inflacion OR inflation OR inversion OR exportaciones)'
    eventos_naturales: 'Panama (sismo OR terremoto OR earthquake OR inundacion OR flood OR lluvias OR sequia)'

banco_mundial:
  base_url: "https://api.worldbank.org/v2"
  paises: [PAN, CRI, COL, DOM, MEX, GTM]
  anio_inicio: 2010
  anio_fin: 2024
  per_page: 1000
  # El PDF declara 1.350 combinaciones, pero 6 países × 6 indicadores × 15 años = 540 (ver manifest).
  cuadricula_declarada_en_pdf: 1350
  licencia: "CC BY 4.0 (excepciones de terceros por indicador: pendiente de verificar)"
  carpeta_cruda: banco_mundial
  pausa_segundos: 1
  indicadores:
    NY.GDP.MKTP.KD.ZG: {nombre: "Crecimiento del PIB", unidad: "% anual"}
    FP.CPI.TOTL.ZG: {nombre: "Inflación (precios al consumidor)", unidad: "% anual"}
    SL.UEM.TOTL.ZS: {nombre: "Desempleo", unidad: "% de la fuerza laboral"}
    SP.POP.TOTL: {nombre: "Población total", unidad: "personas"}
    IT.NET.USER.ZS: {nombre: "Uso de internet", unidad: "% de la población"}
    NE.EXP.GNFS.ZS: {nombre: "Exportaciones de bienes y servicios", unidad: "% del PIB"}

usgs:
  endpoint: "https://earthquake.usgs.gov/fdsnws/event/1/query"
  formato: geojson
  # endtime es exclusivo a la hora indicada: se pide hasta el último segundo del 31/12/2024.
  starttime: "2024-01-01T00:00:00"
  endtime: "2024-12-31T23:59:59"
  minlatitude: 5
  maxlatitude: 12
  minlongitude: -86
  maxlongitude: -76
  minmagnitude: 3
  orderby: time-asc
  licencia: "Dominio público de USGS; condiciones de elementos de terceros: pendiente de verificar"
  carpeta_cruda: usgs
