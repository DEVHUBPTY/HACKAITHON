# Receta de extracción del snapshot (E0-04, D-24, D-74).
# Todo número de este archivo está registrado en docs/parametros.md.

general:
  agente_http: "HackIAthon-extraccion/1.0 (metadatos; uso academico)"
  timeout_segundos: 60
  reintentos: 3
  espera_reintento_segundos: 15
  alcance_texto: "basado únicamente en titular/metadatos"
  idioma_por_defecto: es
  # Carpeta (junto a raw/) con los registros de extracción: fallos y notas que NO son respuestas de API.
  carpeta_registro: registro_extraccion

ventana_noticias:
  # D-74: 30 días previos a la extracción; se amplía hasta 90 si no se alcanza el mínimo.
  dias_base: 30
  dias_maximo: 90
  # E0-09: el mínimo útil (100 no ruido) no se alcanza con 30 días; la spec permite ampliar a 90.
  # Es una decisión explícita: con false, la extracción avisa pero no amplía. Ver docs/parametros.md.
  ampliar_si_no_alcanza_minimo: true
  base_de_medicion: fecha_deteccion   # si falta (RSS sin GDELT), fecha_publicacion
  # El intervalo [2024-01-01, 2025-10-01) de la sección 7 del PDF NO se aplica (D-74).
  intervalo_pdf_seccion_7_no_aplicado: ["2024-01-01", "2025-10-01"]

volumen_noticias:
  meta: 200
  minimo: 100
  minimo_tvn: 20

medios_conocidos:
  tvn-2.com:
    nombre: "TVN Panamá"
    pais: "Panamá"
    condiciones: >-
      Feed RSS público; que sea público no implica licencia abierta sobre artículos, videos o
      imágenes. Solo metadatos; la descripción del RSS es de uso interno y no se guarda en el
      repositorio (D-31, D-72).
medio_tvn_dominio: tvn-2.com

url_canonica:
  esquema: https
  quitar_prefijo_www: true
  parametros_a_quitar: [fbclid, gclid, igshid, mc_cid, mc_eid, ref, ref_src, "utm_*"]

rss_tvn:
  # URL tomada del hipervínculo de la referencia [2] del PDF del reto.
  url: "https://www.tvn-2.com/rss/"
  carpeta_cruda: rss_tvn
  # El RSS no trae categoría: el tema de origen es la primera sección de la ruta de la URL, siempre
  # que la ruta tenga al menos `segmentos_minimos_para_seccion` segmentos (sección + nota).
  segmentos_minimos_para_seccion: 2
  tema_sin_seccion: sin_seccion

gdelt:
  endpoint: "https://api.gdeltproject.org/api/v2/doc/doc"
  modo: ArtList
  formato: json
  orden: DateDesc
  maxrecords: 250
  pausa_segundos: 12           # GDELT pide ~1 solicitud cada 5 s; con 6 s respondió 429 sostenidos
  espera_429_segundos: 30      # base del backoff exponencial (se duplica en cada intento; Retry-After manda)
  max_intentos: 5              # por rango; luego se registra como fallido y se sigue
  rango_dias: 10               # tamaño inicial de cada rango de fechas
  rango_minimo_horas: 6        # límite al subdividir cuando una consulta llega al tope
  carpeta_cruda: gdelt
  # Nombre de idioma de GDELT (se compara sin distinguir mayúsculas) -> ISO 639-1. Lo que no esté
  # aquí se conserva en minúsculas y se marca en transformaciones del manifest.
  idiomas:
    Afrikaans: "af"
    Albanian: "sq"
    Arabic: "ar"
    Armenian: "hy"
    Azerbaijani: "az"
    Basque: "eu"
    Belarusian: "be"
    Bengali: "bn"
    Bosnian: "bs"
    Bulgarian: "bg"
    Catalan: "ca"
    Chinese: "zh"
    Croatian: "hr"
    Czech: "cs"
    Danish: "da"
    Dutch: "nl"
