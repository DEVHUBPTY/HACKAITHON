    Russian: "ru"
    Serbian: "sr"
    Sinhalese: "si"
    Slovak: "sk"
    Slovenian: "sl"
    Somali: "so"
    Spanish: "es"
    Swahili: "sw"
    Swedish: "sv"
    Tamil: "ta"
    Telugu: "te"
    Thai: "th"
    Turkish: "tr"
    Ukrainian: "uk"
    Urdu: "ur"
    Uzbek: "uz"
    Vietnamese: "vi"
    Welsh: "cy"
  # Tema de origen (D-62) = clave. Cada tema tiene dos patas, una llamada por pata y rango
  # (src/consultas_gdelt.py arma "(t1 OR "frase dos") filtros"). Operadores: frase entre comillas,
  # OR entre paréntesis sin anidar, sourcecountry:<país|FIPS>, prefijo '-' para excluir
  # (https://blog.gdeltproject.org/gdelt-doc-2-0-api-debuts/). Nunca 'Panama' suelto + sustantivo genérico
  # (E0-09: ~67 % de lo descargado no era sobre Panamá: Panama City Beach, Panama Papers, etc.).
  motivo_cambio_consultas: >-
    E0-04 (seguimiento): las consultas 'Panama + palabra genérica' traían ~67 % de ruido (E0-09; solo 4 de 95
    de 'logistica' eran logística). Ahora cada tema tiene una pata de medios de Panamá (sourcecountry:panama +
    términos en español) y una internacional con frases específicas de Panamá (excluye medios de Panamá).
  consultas:
    logistica:
      locales:
        descripcion: "Medios de Panamá; términos de logística en español"
        filtros: ["sourcecountry:panama"]
        terminos: [canal, puerto, puertos, logística, logistica, carga, contenedores, naviera, "Zona Libre", "cadena de suministro"]
      internacional:
        descripcion: "Medios de fuera de Panamá; frases específicas"
        filtros: ["-sourcecountry:panama"]
        terminos: ["Panama Canal", "Canal de Panamá", "Panama Canal Authority", "Panama Ports", "Colon Free Zone", "Zona Libre de Colón"]
    turismo:
      locales:
        descripcion: "Medios de Panamá; términos de turismo en español"
        filtros: ["sourcecountry:panama"]
        terminos: [turismo, turistas, cruceros, hoteles, visitantes, "llegada de turistas"]
      internacional:
        descripcion: "Medios de fuera de Panamá; frases específicas"
        filtros: ["-sourcecountry:panama"]
        terminos: ["Panama tourism", "Panama tourists", "turismo en Panamá", "turistas en Panamá", "Panama cruise"]
    economia:
      locales:
        descripcion: "Medios de Panamá; términos de economía en español"
        filtros: ["sourcecountry:panama"]
        terminos: [economía, economia, inflación, inflacion, exportaciones, inversión, PIB, "canasta básica"]
      internacional:
        descripcion: "Medios de fuera de Panamá; frases específicas"
        filtros: ["-sourcecountry:panama"]
        terminos: ["Panama's economy", "Panama economy", "Panama GDP", "Panama inflation", "economía panameña", "economía de Panamá"]
    eventos_naturales:
      locales:
        descripcion: "Medios de Panamá; términos de eventos naturales en español"
        filtros: ["sourcecountry:panama"]
        terminos: [sismo, temblor, terremoto, inundación, inundaciones, lluvias, sequía, deslizamiento, Sinaproc]
      internacional:
        descripcion: "Medios de fuera de Panamá; frases específicas"
        filtros: ["-sourcecountry:panama"]
        terminos: ["Panama earthquake", "Panama flood", "Panama floods", "Panama drought", "sismo en Panamá", "terremoto en Panamá", "inundaciones en Panamá"]

