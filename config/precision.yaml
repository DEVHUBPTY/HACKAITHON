# Precision@5 contra la selección independiente de un editor (E1-19, PDF 9.1 y 11).
# El editor elige sus temas SIN ver el ranking: la hoja que recibe no lleva P, posición, componentes ni estado de evidencia.
version: 1

k: 5                          # temas que elige el editor y que se toman del ranking (PDF 9.1: Precision@5)
cortes_minimos: 3             # fechas de corte distintas para no declarar el resultado exploratorio (spec E1-19, D-57)

hoja_ciega:
  # Orden de la hoja: SHA-256 de «semilla|id_grupo». No usa P, la posición, la fecha ni el tema: no insinúa nada.
  semilla: "e1-19-hoja-ciega"
  columnas: [corte, id_grupo, tema, titular, fecha_reciente, seleccion]
  marca: x                    # lo que escribe el editor en la columna `seleccion` de sus k temas

archivos:
  hoja: eval/hoja_editor_ciega.csv
  seleccion: eval/seleccion_editor.csv
  salida: outputs/precision_at_5.json

textos:
  # D-105: en el corte del top k puede haber un empate en P (sistema) o en la fecha (baseline). El top lo completa la regla de
  # desempate y la salida declara cuántos grupos empatan en el corte y cuántos quedaron fuera (`empate_en_el_corte`).
  criterio_de_empate: "Empates en el corte: el sistema los resuelve con la regla del reto (P mostrado, luego mayor urgencia, luego ID); el baseline, por ID. Se informa cuántos grupos empatan en el corte y cuántos quedan fuera del top."
  pendiente: "pendiente de selección humana"
  exploratoria: "exploratoria: {motivos}"
  motivo_pocos_cortes: "{pruebas} fecha(s) de corte, se piden {cortes_minimos} (con n = 1 se declara así, D-57)"
  motivo_sin_especialista: "no se declaró especialista editorial (--especialista)"
  sin_especialista: "Si no hay especialista editorial, la evaluación se declara exploratoria (D-74)."
