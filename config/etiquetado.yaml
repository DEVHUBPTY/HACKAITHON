# Etiquetado humano (E1-06). Parámetros de la muestra, del acuerdo entre etiquetadores y de los nombres.
# Los temas salen de temas.yaml y las reglas de frontera de docs/guia_temas.md: no se repiten aquí.
version: 1

muestra:
  semilla: 20261006        # semilla fija de la muestra aleatoria (docs/etiquetado.md)
  tamano: 100              # titulares de la muestra (supuesto: tiempo disponible)
  tamano_acuerdo: 20       # N titulares los etiquetan DOS personas por separado (D-71)
  # Muestra estratificada por la decisión del filtro automático (E1-03b): aleatoria dentro de cada estrato.
  # "no_ruido" incluye las notas de alcance regional (D-84). Si un estrato no alcanza su cuota, el resto
  # se completa con el otro. Cada fila lleva su estrato y su peso (población / muestra) para reponderar.
  estratos:
    no_ruido: {cuota: 70, dobles: 14}
    ruido: {cuota: 30, dobles: 6}
  # Muestra original FIJA (las 100 etiquetas de D-85). No se vuelve a sortear: desde entonces cambió el filtro de ruido
  # (5 titulares cambiarían) y la base creció. Se generó reproduciendo la semilla sobre la población y los estratos de
  # entonces (docs/etiquetado.md, "Muestra congelada").
  congelada: eval/muestra_original.csv
  # Ampliaciones: titulares nuevos que se agregan DESPUÉS de los 100, cada uno con su estrato y su peso. No alteran la
  # muestra original. Un censo de la captura nueva pesa 1.0 (docs/etiquetado.md, "Ampliación 2026-10-08").
  ampliaciones:
    - nombre: tvn_20261008
      ids_desde: eval/propuestas/llm_20261008.csv
      estrato: ampliacion_tvn_20261008
      peso_muestreo: 1.0

archivos:
  carpeta_personas: eval/etiquetas      # una hoja por persona: <nombre>.csv
  consolidado: eval/etiquetas.csv       # una fila por titular; lo genera --consolidar
  carpeta_propuestas: eval/propuestas   # propuestas de un LLM (id_noticia, ruido, temas...): rellenan el formulario, nunca cuentan como etiqueta
  ejemplos_excluidos: config/ejemplos_excluidos.txt

ruido:
  sin_ruido: ninguno
  # fuera_de_temas de temas.yaml + no_es_noticia (decisión del equipo tras revisión, spec E1-06)
  motivos: [no_es_panama, fuera_de_temas, no_es_noticia]

acuerdo:
  kappa_minimo: 0.6        # por debajo se revisa la guía antes de usar las etiquetas (D-71)

nombres:
  longitud_minima: 3
  # Un nombre se rechaza si alguna de sus palabras (sin tildes, minúscula) es uno de estos marcadores.
  marcadores_ia:
    - claude
    - anthropic
    - gpt
    - chatgpt
    - openai
    - gemini
    - gemma
    - qwen
    - llama
    - mistral
    - ollama
    - deepseek
    - copilot
    - codex
    - sonnet
    - opus
    - haiku
    - modelo
    - asistente
    - agente
    - sistema
    - automatico
    - baseline
    - benchmark
    - script

  # Marcadores tan cortos que podrían ser parte de un nombre real ("Ai", "Ia"): solo se rechaza el nombre
  # COMPLETO si es exactamente uno de ellos.
  marcadores_ia_nombre_completo: [ia, ai, llm, bot]

interfaz:
  zona_horaria: America/Panama
  formato_fecha: "%d/%m/%Y %H:%M"
