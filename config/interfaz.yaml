# E1-15 · Interfaz Streamlit: constantes de presentación (orden de pantallas, tamaños, textos fijos y el punto de enganche
# con la generación de E1-12). Ninguna regla de negocio vive aquí: puntajes, acciones y vacíos los leen otras etapas.
# Cada número está en docs/parametros.md. Ningún texto de la interfaz habla de publicar (lo valida el modelo).
version: "1.0"

titulo_app: "HackIAthon · De la señal a la decisión"
modalidad_inicial: editorial

pantallas:                          # orden de la barra lateral (D-128): las siete etapas del reto (PDF sección 3, con su nombre) y, aparte, la consulta
  # D-131: cada pantalla trae su `guia` (qué hace, cómo leerla, qué caso de uso demuestra, qué entra y qué sale) y, en las etapas, la cuenta viva (`medida`, la misma de `cargar.arquitectura`)
  - clave: calidad
    url_path: cargar
    titulo: "1 · Cargar"
    descripcion: "Leer el paquete público congelado. Validar IDs, URLs, fechas, campos obligatorios y filas nulas. Emitir un reporte de calidad."
    guia:
      que_hace: "Lee el paquete público congelado y comprueba que cada registro sea utilizable: IDs, URLs, fechas, campos obligatorios y nulos."
      como_leer: "Arriba está la arquitectura del prototipo con la cuenta real de cada paso; más abajo se puede ejecutar la carga en vivo o probar un archivo propio. Lo que no sirve se marca, no se borra."
      caso_de_uso: "Ninguno de los cinco: aquí se demuestra la prueba T01 de carga con validación."
      entra: "El paquete público congelado: noticias, indicadores, sismos y series de la SBP"
      sale: "Registros válidos y un reporte de calidad"
      medida: registros_validos
      unidad_cuenta: "registros válidos"
  - clave: organizar
    url_path: organizar
    titulo: "2 · Organizar"
    descripcion: "Clasificar temas: economía, logística/Canal, turismo, servicios públicos, eventos naturales y regulación. Agrupar noticias sobre el mismo evento."
    guia:
      que_hace: "Clasifica cada titular en uno de los seis temas del reto y agrupa los que hablan del mismo evento."
      como_leer: "Cada fila de la tabla es un grupo. Compare titulares, medios y procedencias: repetir un titular no es corroborarlo."
      caso_de_uso: "CU-03 · Agrupar titulares repetidos y distinguir repetición de corroboración independiente."
      entra: "Registros válidos"
      sale: "Grupos de titulares con su tema y sus procedencias independientes"
      medida: grupos
      unidad_cuenta: "grupos de noticias"
  - clave: contextualizar
    url_path: contextualizar
    titulo: "3 · Contextualizar"
    descripcion: "Relacionar noticias con indicadores o eventos oficiales pertinentes. Mostrar período, unidad y limitaciones. Si no existe relación sustentada, no forzarla."
    guia:
      que_hace: "Relaciona cada grupo con indicadores o eventos oficiales pertinentes, con su período, su unidad y sus limitaciones."
      como_leer: "Cada fila es un vínculo con un dato oficial. Los datos del Banco Mundial son anuales, no de hoy. Si no hay una relación sustentada, no se fuerza."
      caso_de_uso: "CU-02 · Incorporar una serie oficial a un tema económico sin confundir un dato anual histórico con una medición de hoy."
      entra: "Grupos de titulares y datos oficiales (Banco Mundial, USGS y SBP)"
      sale: "Vínculos sustentados, o la constancia de que no hay relación"
      medida: vinculos
      unidad_cuenta: "vínculos con datos oficiales"
  - clave: bandeja
    url_path: priorizar
    titulo: "4 · Priorizar"
    descripcion: "Calcular un puntaje de atención, mostrar componentes y generar una lista ordenada. Distinguir relevancia de suficiencia de evidencia."
    guia:
      que_hace: "Calcula un puntaje de atención de 0 a 100, muestra sus cinco componentes y ordena la lista."
      como_leer: "P ordena la atención; el estado de evidencia dice si ya se puede trabajar. Son independientes: un tema puede ser prioritario y tener evidencia insuficiente."
      caso_de_uso: "CU-01 · ¿Qué cinco temas merecen revisión para la agenda de Panamá y por qué? En la modalidad Banca, la bandeja por sector sirve a CU-05."
      entra: "Grupos con sus vínculos oficiales"
      sale: "Ranking con puntaje, componentes, estado de evidencia y acción recomendada"
      medida: grupos_puntuados
      unidad_cuenta: "grupos puntuados"
  - clave: ficha
    url_path: explicar
    titulo: "5 · Explicar"
    descripcion: "Abrir una ficha: qué se reporta, quién lo reporta, qué está respaldado, qué falta comprobar y qué acción se recomienda al usuario."
    guia:
      que_hace: "Abre la ficha de un grupo: qué se reporta, quién lo reporta, qué está respaldado, qué falta comprobar y qué acción se recomienda."
      como_leer: "Empiece por el resumen y despliegue cada sección. Cada línea respaldada lleva su cita (ID y campo), y un titular se lee como declaración de su medio, no como hecho."
      caso_de_uso: "CU-01 y CU-04 · Evidencia disponible y vacíos de verificación; ante una cifra sin dato oficial, la ficha se abstiene."
      entra: "Un grupo de la bandeja"
      sale: "Ficha de evidencia con citas verificables"
      medida: fichas_disponibles
      unidad_cuenta: "fichas de evidencia"
  - clave: paquete
    url_path: producir
    titulo: "6 · Producir"
    descripcion: "Redactar un borrador propio de la modalidad, con citas por afirmación. Diferenciar hechos, declaraciones, inferencias e hipótesis."
    guia:
      que_hace: "Redacta el borrador propio de la modalidad, con citas por afirmación, a partir de lo que la ficha respalda."
      como_leer: "Cada afirmación indica su tipo: hecho, declaración, inferencia o hipótesis. Si la evidencia no alcanza, no hay guion ni copy, solo un paquete de investigación. Aquí se lee lo ya guardado."
      caso_de_uso: "CU-02 · Redactar un brief sin confundir datos anuales con mediciones de hoy. En la modalidad Banca, CU-05 · boletín del entorno logístico."
      entra: "Una ficha con evidencia"
      sale: "Borrador con citas y su leyenda de alcance"
      medida: borradores_en_cache
      unidad_cuenta: "respuestas del LLM guardadas"
  - clave: revision
    url_path: revisar
    titulo: "7 · Revisar"
    descripcion: "Registrar aceptación, corrección o descarte por una persona responsable. Crear o actualizar la ficha en Notion (registro en Notion)."
    guia:
      que_hace: "Una persona acepta, corrige o descarta el borrador y deja el registro; después se crea o actualiza la ficha en Notion."
      como_leer: "Elija el grupo, abra el caso y use las acciones. El estado máximo es «aprobado como borrador», y cada cambio queda como una fila nueva del historial."
      caso_de_uso: "Ninguno de los cinco: es el flujo de revisión humana de la etapa 7 del reto."
      entra: "Un borrador"
      sale: "Caso con estado, historial y ficha lista para Notion"
      medida: casos_revisados
      unidad_cuenta: "casos abiertos para revisar"
  - clave: consulta
    url_path: consulta
    titulo: "Consulta"
    descripcion: "Herramienta aparte: preguntas en español sobre los datos, con abstención cuando no hay evidencia suficiente."
    separada: true
    guia:
      que_hace: "Responde preguntas en español sobre los datos cargados, con citas, o se abstiene cuando no hay evidencia suficiente."
      como_leer: "Pruebe un ejemplo. Una cita se abre con un clic y muestra el registro original, con el año del dato y la fecha de extracción. Una abstención dice qué faltaría."
      caso_de_uso: "CU-04 · Preguntar por una cifra inexistente o por una contradicción: abstenerse o mostrar las versiones y la verificación pendiente."
      entra: "Una pregunta en español"
      sale: "Respuesta con citas, o abstención"
pantalla_inicial: inicio            # D-131: la aplicación abre en «Cómo funciona»

inicio:                             # D-131: pantalla de entrada; las cuentas de cada etapa salen de los datos (guia.medida de cada pantalla)
  titulo: "Cómo funciona"
  descripcion: "Una secuencia de siete etapas que convierte titulares públicos y datos oficiales en una bandeja de temas priorizados, fichas de evidencia y borradores para una decisión humana."
  proposito: "Cada etapa recibe el resultado de la anterior y entrega algo que la siguiente puede usar. Se puede recorrer en orden, de la señal a la decisión, o abrir directamente la etapa que se necesite."
  titulo_modalidades: "Tres modalidades, un mismo núcleo"
  texto_cita: "El reto dice: «El equipo elegirá una modalidad» (PDF sección 3). Este prototipo implementa la principal y cubre las otras dos así:"
  modalidades:
    - nombre: "TVN · principal"
      quien: "Editor/a y periodista"
      obtiene: "agenda priorizada, ficha de investigación, preguntas pendientes y borradores por formato."
      alcance: "Es la modalidad que implementa este prototipo."
    - nombre: "TVN · digital"
      quien: "Productor/a digital"
      obtiene: "propuestas de titulares, resumen web y copy social, siempre sujetos a revisión."
      alcance: "Se cubre dentro del mismo paquete editorial: titulares propuestos, resumen web y copy digital."
    - nombre: "Banca"
      quien: "Analista de estudios económicos o riesgo sectorial"
      obtiene: "boletín de entorno, señales y preguntas para seguimiento."
      alcance: "Es una extensión, configurada sobre el mismo núcleo. Solo esta modalidad usa la fuente D (informes agregados de la SBP)."
  titulo_etapas: "Las siete etapas, de la señal a la decisión"
  ayuda_etapas: "Cada columna muestra lo que entra en la etapa, lo que sale y cuánto hay ahora en los datos de esta base."
  etiqueta_entra: "Entra"
  etiqueta_sale: "Sale"
  boton_abrir: "Abrir {titulo}"
  sin_dato: "sin dato"
  titulo_reglas: "Tres reglas de la casa"
  reglas:
    - {titulo: "Todo es borrador", texto: "Nada se da por definitivo: el estado máximo es «aprobado como borrador» y toda salida lleva su leyenda de alcance."}
    - {titulo: "Cada afirmación lleva su cita", texto: "Una cita es el ID de un registro más el campo que lo respalda. Lo que no se puede citar, no se afirma."}
    - {titulo: "La persona revisora decide", texto: "El sistema ordena y propone; aceptar, corregir o descartar es siempre una decisión humana."}
  texto_arquitectura: "La arquitectura del prototipo (PDF sección 8), con la cuenta real de cada paso, está en la etapa 1."
  boton_arquitectura: "Ver la arquitectura en 1 · Cargar"

navegacion:                         # D-131: indicador de etapas, bloque de guía y botones de etapa anterior y siguiente
  que_hace: "Qué hace esta etapa"
  como_leer: "Cómo leer esta pantalla"
  caso_de_uso: "Caso de uso que se demuestra aquí"
  anterior: "Etapa anterior: {titulo}"
  siguiente: "Siguiente: {titulo}"
  url_inicio: ""                    # D-133: «Cómo funciona» es la raíz (/); cada otra pantalla tiene su `url_path` en `pantallas`
  conservar_estado:                 # D-133: Streamlit borra el valor de un widget al salir de su página; estos se copian al estado de la sesión para que sobrevivan
    claves: [consulta_texto, consulta_metodo, pesos_justificacion, bandeja_todas, revision_revisor, revision_comentario, revision_motivo_evidencia,
             revision_motivo_descarte, revision_motivo_reabrir, revision_motivo_vinculo]
    prefijos: [peso_, revision_texto_, revision_confirmar_]

estilo:                             # D-131: sistema visual claro y editorial. El tema base está en .streamlit/config.toml y debe coincidir (lo vigila una prueba)
  acento: "#0E7C86"                 # petróleo: lo único con acento (secuencia, etapa actual y botones principales)
  tinta: "#1B2A41"
  papel: "#F6F7F9"
  papel_secundario: "#E8ECF1"
  semanticos:                       # colores con significado, reservados a eso: columna de la bandeja → valor → color
    rango: {alto: "#B3261E", medio: "#C98A12"}
    evidencia: {insuficiente: "#C98A12", suficiente: "#2E7D4F"}
  css: |
    .st-key-guia_etapa { border-left: 3px solid ${acento}; padding: 0.1rem 0 0.1rem 0.9rem; margin: 0.25rem 0 1.25rem; }
    .st-key-guia_etapa p { margin: 0.2rem 0; }
    [class*="st-key-paso_"] button { min-height: 2.1rem; padding: 0.15rem 0.3rem; line-height: 1.15; }
    [class*="st-key-paso_"] button p { font-size: 0.8rem; }
    [class*="st-key-etapa_"] { border-top: 2px solid ${acento}; padding-top: 0.5rem; }
    [class*="st-key-regla_"] { border-left: 3px solid ${tinta}; padding-left: 0.8rem; }
    .st-key-navegacion_pie { border-top: 1px solid ${papel_secundario}; padding-top: 0.75rem; margin-top: 1rem; }
    h1, h2, h3 { letter-spacing: -0.01em; }

cargar:                             # D-128: la arquitectura mínima del PDF (sección 8); cada cuenta sale de los datos, nunca está escrita aquí
  titulo_arquitectura: "Arquitectura del prototipo (PDF sección 8)"
  ayuda_arquitectura: "Cada paso muestra su cuenta real en los datos de esta base; el botón abre la pantalla donde se ve. Una carga por lote: sin monitoreo continuo y sin internet durante el pitch."
  arquitectura:
    - {etiqueta: "Fuentes públicas / snapshot", medida: registros_leidos, unidad: "registros leídos", pantallas: [calidad], ancla: fuentes}
    - {etiqueta: "Validación y normalización", medida: registros_validos, unidad: "registros válidos", pantallas: [calidad], ancla: validacion}
    - {etiqueta: "Almacenamiento", medida: filas_en_base, unidad: "filas en senales.duckdb (noticias, indicadores y sismos)", pantallas: [calidad], ancla: almacenamiento}
    - {etiqueta: "Búsqueda y agrupación", medida: grupos, unidad: "grupos de noticias", pantallas: [organizar, contextualizar, consulta]}
    - {etiqueta: "Motor de priorización", medida: grupos_puntuados, unidad: "grupos puntuados", pantallas: [bandeja]}
    - {etiqueta: "Generación con evidencias", medida: borradores_en_cache, unidad: "respuestas del LLM guardadas (no son borradores por grupo)", pantallas: [paquete]}
    - {etiqueta: "Interfaz", medida: fichas_disponibles, unidad: "fichas de evidencia disponibles", pantallas: [ficha]}
    - {etiqueta: "Revisión humana", medida: casos_revisados, unidad: "casos abiertos para revisar", pantallas: [revision]}
    - {etiqueta: "Registro en Notion", medida: casos_exportados, unidad: "casos exportados a la fila de Notion", pantallas: [revision]}

organizar:                          # D-128: etapa 2
  titulares_visibles: 50            # titulares del grupo que se listan al abrirlo (el grupo más grande del snapshot tiene 20)
  motivos_ruido:                    # el ruido se marca, no se borra: cada motivo con su nombre legible
    no_es_panama: "No es sobre Panamá"
    no_es_noticia: "No es una nota con contenido"
    fuera_de_temas: "Fuera de los seis temas del reto"
  ayuda_grupos: "Orden con un clic en el encabezado de cada columna. Repetición no es corroboración: lo que cuenta son las procedencias independientes."
  ayuda_procedencias: "Una agencia replicada por varios medios cuenta como una sola procedencia."

contextualizar:                     # D-128: etapa 3
  fuentes: {indicador: "Banco Mundial", usgs: "USGS", sbp: "SBP"}
  relaciones: {directa: "directa", indirecta: "indirecta", evento: "evento"}
  roles: {panama: "Panamá", comparable: "país comparable", tendencia: "tendencia", contexto_historico: "contexto histórico"}
  motivos_sin_vinculo:
    sin_relacion_sustentada: "No se fuerza la relación: ningún titular sustenta un dato oficial"
    tema_sin_indicador: "El tema no tiene indicador oficial asociado"
  aviso_no_forzar: "Si no existe una relación sustentada, no se fuerza: el grupo queda sin vínculo oficial y la ficha lo dice."
  aviso_usgs: "La caja de USGS no es Panamá: se muestra el lugar original y solo sirve para hechos sísmicos."

registro_notion:                    # D-128: etapa 7, el «registro en Notion» del PDF (crear o actualizar la ficha del caso en la base «Casos y evidencias»)
  subtitulo: "Registro en Notion"
  explicacion: "Crea o actualiza la ficha de este caso en «Casos y evidencias» de Notion. La ficha conserva la marca BORRADOR: registrar no la convierte en contenido definitivo."
  boton_exportar: "Registro en Notion: exportar la ficha"
  ayuda_exportar: "Genera el Markdown y la fila CSV de «Casos y evidencias» desde la ficha revisada, para importarlos a mano en Notion; si el caso ya se exportó, actualiza esa fila del CSV local (en Notion hay que reemplazarla: docs/notion.md)."
  boton_exportar_huerfano: "Registro en Notion: exportar {id_caso}"
  boton_api: "Crear o actualizar la ficha en Notion por la API"
  ayuda_api: "Necesita NOTION_TOKEN en local.env y red. Primero exporta el caso; sin token o sin red queda la exportación local (docs/notion.md)."
  sin_token: "La sincronización por la API no está configurada: falta NOTION_TOKEN en local.env. Con el Markdown y el CSV se registra a mano, o con `poetry run python -m src.exportar --caso {id_caso} --notion`."
  api_ok: "{id_caso}: ficha creada o actualizada en Notion."
  api_fallo: "{id_caso}: la API de Notion no respondió o rechazó la ficha ({detalle}). La exportación local quedó escrita."

bandeja:
  filas_iniciales: 10               # cuántas filas del ranking se muestran al abrir (el resto, con «Mostrar todas»)
  alto_filas_px: 36                 # alto de cada fila de la tabla
  decimales_puntaje: 1              # decimales de P y de las barras R·I·U·N·E al mostrarlas (el dato no se redondea)
  largo_titular_selector: 80        # caracteres del titular en los selectores de grupo
  ancho_titular_cli: 70             # caracteres del titular en la bandeja por sector que imprime `src.puntaje` (E2-01)
  filas_iniciales_por_sector: 3     # bandeja por sector (E2-01): filas de cada bloque al abrir; ningún sector se oculta (el resto, con «Mostrar todas»)

pesos_editables:                  # E3-04: vista «¿y si los pesos fueran otros?» de la bandeja. Es del navegador, no la configuración oficial
  minimo: 5                         # cada peso debe estar entre `minimo` y `maximo` (puntos); la suma es siempre 100 (PDF sección 4)
  maximo: 50
  paso: 1
  decimales: 2                      # los pesos se redondean a estos decimales antes de validar y de mostrar (50.0000001 es 50, no «fuera de rango»)
  justificacion_minima_caracteres: 15   # PDF: «permitir justificar cambios de pesos»: sin justificación no se puede descargar la propuesta
  movimientos_mostrados: 10         # filas de la tabla de movimientos frente al ranking oficial
  textos:
    aviso: "ESCENARIO, no es la configuración oficial. Reglas v{version} siguen vigentes: el ranking, las fichas, las exportaciones y el registro de revisión usan los pesos oficiales."
    sin_cambios: "Los pesos son los oficiales: no hay diferencias."
    suma: "Los pesos suman {suma} y deben sumar {objetivo}."
    rango: "El peso {componente} ({valor}) debe estar entre {minimo} y {maximo}."
    justificacion: "Escriba una justificación de al menos {minimo} caracteres para descargar la propuesta."
    propuesta_estado: "propuesta no oficial: no modifica config/reglas_v1.3.yaml; adoptarla es decisión del dueño"

calidad:
  top_medios: 5                     # medios con más titulares válidos en el reporte

consulta:
  metodo_inicial: semantica
  largo_maximo_caracteres: 500      # la caja de la consulta no acepta más
  parametro_pregunta: q             # D-133: /consulta?q=<pregunta> guarda la última pregunta en la URL; al recargar se vuelve a consultar (local, sin LLM)
  parametro_metodo: m               # D-133: /consulta?q=<pregunta>&m=semantica|bm25 también guarda el método
  texto_ultima_respuesta: "Respuesta a la última pregunta consultada: «{pregunta}»"
  ejemplos:                         # consultas de muestra: una útil, una de abstención (docs/demo.md)
    - "¿Cuál fue la inflación de Panamá en 2023?"
    - "¿Qué se reporta sobre la visita del presidente de Panamá a Singapur y Vietnam?"
    - "¿Cuál fue el desempleo de Panamá en 2025?"

ficha:
  prefijo_desglose: "Desglose del puntaje"   # la línea de la vista que va en el desplegable del desglose
  secciones_resumen: [que_se_reporta, accion_recomendada]
  secciones_desplegables: [quien_lo_reporta, respaldado, falta_comprobar]
  citas_por_fila: 3                 # recuadros de cita por fila
  campos_ocultos: [descripcion]     # nunca se muestran, aunque una cita los pida (D-31)

demo:
  ruta_base: data/demo.duckdb       # la crea C-06; sin ella el modo demo avisa y no inventa datos
  parametro_caso: caso              # ?caso=<GRP-…|posición> abre la ficha
  paginas_con_caso: [ficha, paquete, revision]   # D-133: ?caso= se queda en estas pantallas; desde cualquier otra abre «5 · Explicar»
  guion: docs/demo.md               # los pasos de la barra lateral salen de la tabla de este archivo
  espera_verificacion_s: 180        # C-06: tiempo máximo de scripts.verificar_offline para dibujar la pantalla de entrada (la primera carga tarda 15–20 s)

citas:
  decimales_valor: 2                # decimales del valor de un indicador en el recuadro de cita (el dato no se redondea)
  aviso_anual: "Dato anual del Banco Mundial: no describe la situación actual."
  etiqueta_url_api: "Fuente de datos (API)"          # fuente_url del contrato de datos: devuelve JSON crudo, se conserva como procedencia
  etiqueta_enlace_humano: "Ver en el Banco Mundial"
  etiqueta_periodo: "Período"                # D-129: periodo de un registro SIS-
  etiqueta_limitaciones: "Limitaciones"      # D-129: limitaciones de un registro SIS-
  plantilla_enlace_indicador: "https://datos.bancomundial.org/indicador/{indicador}?locations={iso2}"   # página legible (en español; la versión en inglés daba 504)
  iso2_por_pais: {PAN: PA, CRI: CR, COL: CO, DOM: DO, MEX: MX, GTM: GT}   # los 6 países del reto; un país sin entrada solo muestra la URL de la API

generacion:                         # punto de enganche con E1-12 (src/generacion.py); se conecta tras integrar esa tarea
  modulo: src.generacion
  funcion: generar_paquete          # contrato: funcion(id_grupo, modalidad, *, solo_cache=True) -> mapa | modelo pydantic | None
  solo_cache: true                  # la interfaz nunca espera al LLM: usa borradores de caché (sin red)

paquete:                            # etiquetas de los campos del paquete (docs/salidas.md) en la pantalla Paquete
  etiqueta_usuario: "Para: {usuario}"     # D-131: a quién sirve cada sección (columna «Lector» de docs/salidas.md)
  lectores:
    editor: "Editor/a y periodista"
    produccion: "Producción"
    digital: "Productor/a digital (TVN · digital)"
