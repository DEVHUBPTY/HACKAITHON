      - {titulo: "Autoridad sanciona a empresa con multa millonaria", real: false}
      - {titulo: "Resolución fija nuevas reglas para las telecomunicaciones", real: false}
      - {titulo: "Panamá ratifica convenio internacional sobre transporte marítimo", real: false}
      - {titulo: "Asamblea discute proyecto de ley sobre contratación pública", real: false}
      - {titulo: "Superintendencia emite acuerdo sobre prevención de blanqueo de capitales", real: false}

fuera_de_temas:
  no_es_panama: "La noticia no trata sobre Panamá ni lo afecta (Panama City de Florida, sombreros Panamá)."
  fuera_de_temas: "Es sobre Panamá, pero de un área que el reto no cubre (deportes, farándula, cultura, política electoral sin norma)."
