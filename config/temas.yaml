      - {titulo: "Retrasos en la rehabilitación de la carretera dejan incomunicadas a varias comunidades", real: false}
      - {titulo: "Contraloría detecta sobrecostos en la construcción de un puente en el interior", real: false}
  eventos_naturales:
    nombre: "Eventos naturales"
    descripcion: "Sismos, inundaciones y lluvias, deslizamientos, sequía y El Niño, incendios forestales y alertas de protección civil. La interrupción de un servicio causada por el fenómeno va a Servicios públicos."
    ejemplos:
      - {titulo: "Clima en Panamá: Martes con lluvias y tormentas eléctricas en varias regiones durante la tarde", id_noticia: NOT-2f73db1173, real: true}
      - {titulo: "Contenido Exclusivo: Coclé, se seca el campo", id_noticia: NOT-f2f4a261fd, real: true}
      - {titulo: "Quebrada se desborda y anega viviendas en Arraiján", real: false}
