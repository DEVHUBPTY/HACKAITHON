      - {titulo: "Incendio forestal consume hectáreas en Veraguas", real: false}
      - {titulo: "Temblor de magnitud moderada se siente en la capital", real: false}
      - {titulo: "Río se desborda y deja familias afectadas en Darién", real: false}
