# Los 6 temas del reto: descripción ("Incluye" de docs/guia_temas.md), titulares de ejemplo y subtemas con prototipo.
# Ejemplos: real=true viene del snapshot (su id_noticia está en config/ejemplos_excluidos.txt y NUNCA entra en la evaluación);
# real=false es ilustrativo, escrito para fijar el criterio, y NO se presenta como real (docs/exploracion.md, recomendaciones E1-05).
# Opción A (D-21) usa descripción + ejemplos; opción B usa los prototipos de los subtemas. Ambas devuelven solo estos 6 temas.
version: "1.0"

temas:
  economia:
    nombre: "Economía"
    descripcion: "Crecimiento y PIB, inflación y precios (canasta básica, combustibles), empleo, finanzas públicas (deuda, presupuesto, recaudación), inversión, comercio exterior, banca y calificaciones de riesgo. No incluye ingresos o peajes del Canal (Logística/Canal) ni una ley o impuesto nuevo (Regulación)."
    ejemplos:
      - {titulo: "¿ Cómo se fija el precio del combustible en Panamá ? El MEF explica la fórmula quincenal tras aprobarse nuevo subsidio", id_noticia: NOT-1710ce462f, real: true}
      - {titulo: "Exportaciones de banano superan los $17 millones en junio y marcan recuperación", id_noticia: NOT-623c659be3, real: true}
      - {titulo: "Inflación cerró el año en cifra récord, según el INEC", real: false}
      - {titulo: "Gobierno anuncia recorte del presupuesto de inversión", real: false}
      - {titulo: "Desempleo baja en el último trimestre", real: false}
      - {titulo: "Banca panameña reporta crecimiento de los depósitos", real: false}
      - {titulo: "Calificadora mantiene la nota de riesgo de Panamá", real: false}
