      crecimiento_pib:
        nombre: "Crecimiento y PIB"
        prototipo: "La economía panameña crece según el último dato del PIB"
      inflacion_precios:
        nombre: "Inflación y precios (canasta básica, combustibles)"
        prototipo: "Sube el precio de la canasta básica y de los combustibles"
      empleo:
