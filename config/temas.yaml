# Los 6 temas del reto: descripción ("Incluye" de docs/guia_temas.md), titulares de ejemplo. D-125: el reto define 6 temas y ningún subtema.
# Ejemplos: real=true viene del snapshot (su id_noticia está en config/ejemplos_excluidos.txt y NUNCA entra en la evaluación);
# real=false es ilustrativo, escrito para fijar el criterio, y NO se presenta como real (docs/exploracion.md, recomendaciones E1-05).
# El método A (D-21) usa descripción + ejemplos; la regresión logística (D-121) entrena con los mismos textos.
version: "1.0"
cantidad_temas: 6        # los 6 temas del reto (PDF sección 3, etapa 2)
# Sectores del boletín de banca (D-11, propuesta): servicios públicos y eventos naturales -> continuidad operativa.
sectores_validos: [economía, logística, turismo, regulación, continuidad operativa]

temas:
  economia:
    nombre: "Economía"
    descripcion: "Crecimiento y PIB, inflación y precios (canasta básica, combustibles), empleo, finanzas públicas (deuda, presupuesto, recaudación), inversión, comercio exterior, banca y calificaciones de riesgo. No incluye ingresos o peajes del Canal (Logística/Canal) ni una ley o impuesto nuevo (Regulación)."
    ejemplos:
      - {titulo: "¿ Cómo se fija el precio del combustible en Panamá ? El MEF explica la fórmula quincenal tras aprobarse nuevo subsidio", id_noticia: NOT-1710ce462f, real: true}
      - {titulo: "Exportaciones de banano superan los $17 millones en junio y marcan recuperación", id_noticia: NOT-623c659be3, real: true}
      - {titulo: "Gobierno anuncia recorte del presupuesto de inversión", real: false}
      - {titulo: "Desempleo baja en el último trimestre", real: false}
      - {titulo: "Banca panameña reporta crecimiento de los depósitos", real: false}
      - {titulo: "Calificadora mantiene la nota de riesgo de Panamá", real: false}
      - {titulo: "Precio de la canasta básica sube por tercer mes", real: false}
  logistica:
    nombre: "Logística/Canal"
    descripcion: "Operación del Canal (tránsitos, calado, reservas, niveles del lago Gatún), puertos, Zona Libre de Colón, carga aérea, transporte de carga y cadenas de suministro. No incluye vuelos de pasajeros (Turismo) ni reglas nuevas de la ACP (Regulación)."
    ejemplos:
      - {titulo: "Inland navigation workers stand with Panama Canal workers after death of tug captain", id_noticia: NOT-052735cae3, real: true}
      - {titulo: "Canal de Panamá manejará presupuesto de B /. 5 , 555 millones para 2027", id_noticia: NOT-5a4863366a, real: true}
      - {titulo: "Panamá reforzará su presencia marítima en Vietnam con nueva oficina de servicio técnico de la AMP en Ho Chi Minh", id_noticia: NOT-f7f8b492d1, real: true}
      - {titulo: "Zona Libre de Colón reporta caída de ventas", real: false}
      - {titulo: "Puerto de Manzanillo amplía su capacidad de contenedores", real: false}
      - {titulo: "Naviera anuncia nueva ruta de carga por el Canal", real: false}
      - {titulo: "Canal habilita cupos adicionales para buques", real: false}
  turismo:
    nombre: "Turismo"
    descripcion: "Llegada de visitantes, cruceros, hotelería y ocupación, aviación de pasajeros y conectividad, destinos y promoción. No incluye carga aérea (Logística/Canal)."
    ejemplos:
      - {titulo: "Montería estrenará vuelo directo a Panamá con Satena y conexión aérea de menos de una hora", id_noticia: NOT-d25926a799, real: true}
      - {titulo: "Llegada de cruceristas a Colón supera lo previsto", real: false}
      - {titulo: "Ocupación hotelera alcanza el 80 % en el feriado", real: false}
      - {titulo: "Panamá promociona sus playas en feria de turismo", real: false}
      - {titulo: "Se anuncian nuevas frecuencias semanales hacia ciudades de Colombia", real: false}
      - {titulo: "Autoridad de Turismo reporta más visitantes que el año pasado", real: false}
      - {titulo: "Hoteles de Bocas del Toro registran temporada alta", real: false}
      - {titulo: "Turistas extranjeros eligen Boquete para sus vacaciones", real: false}
      - {titulo: "Nuevo crucero inaugura la ruta del Caribe hacia Panamá", real: false}
      - {titulo: "Feria de turismo en Madrid promueve a Panamá como destino", real: false}
  servicios_publicos:
    nombre: "Servicios públicos"
    descripcion: "Agua potable, electricidad, telecomunicaciones e internet, transporte público, recolección de basura, salud pública, educación pública, seguridad ciudadana y obras públicas (carreteras, puentes, acueductos, licitaciones y contratos de obra, sobrecostos de obra). Una ley o reforma nueva sobre el servicio va a Regulación."
    ejemplos:
      - {titulo: "Déficit de personal limita la capacidad operativa de los bomberos en el país", id_noticia: NOT-0d7f10257c, real: true}
      - {titulo: "Minsa: Adelantan vacunación contra VSR en embarazadas", id_noticia: NOT-3175aafec0, real: true}
      - {titulo: "Minsa enciende alarmas por diagnósticos de cáncer de mama en hombres en Panamá", id_noticia: NOT-3be05280f2, real: true}
      - {titulo: "Colegios particulares atribuyen aumento de matrícula a migración al sector oficial y altos costos de operación", id_noticia: NOT-8921b118ee, real: true}
