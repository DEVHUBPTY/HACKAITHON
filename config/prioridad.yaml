# E1-10 · Prioridad: lo que `reglas_v1.3.yaml` no fija (geografía, cifras, contradicciones, vacíos, sensibilidad).
# Cada número está en docs/parametros.md con su origen. Los pesos, rangos, U, N, E y el estado de evidencia viven en
# reglas_v1.3.yaml; la tabla de acciones, en modalidad_<modalidad>.yaml. Aquí no hay ninguna diferencia entre modalidades.
version: 1

comparacion:
  decimales_p: 9                  # U se compara redondeado a estos decimales en el desempate (evita empates rotos por ruido de coma flotante)
  # D-105: P se compara con los decimales que MUESTRA la bandeja (interfaz.yaml: bandeja.decimales_puntaje). Dos grupos que se
  # ven con el mismo P están empatados y los ordena la regla del reto (mayor U, luego ID), no un decimal oculto.
  decimales_empate: 1

impacto:
  alcance_tema_desconocido: 0.5   # grupo sin tema (`sin_tema`): alcance neutro (D-109 bajó `alcance_geografico.desconocido` a 0.3; el tema desconocido sigue en 0.5)

dato_oficial:                     # qué vínculos de `vinculos` (columna `tipo`) cuentan como dato oficial en E y en el estado de evidencia
  relaciones_aceptadas: [directa, evento]   # `indirecta` NO: el indicador es contexto lejano y no mide el hecho (vinculos.yaml)
  estado_evento_automatico: automatic       # `vinculos.estado_evento` de un evento oficial que todavía no fue revisado (vacío `evento_sin_revisar`)

geografia:                        # alcance geográfico de I: se buscan los términos de reglas_v1.3.yaml:geografia en los titulares
  # Términos que nombran al país y a una provincia a la vez: solo cuentan como la provincia si los precede alguno de estos prefijos.
  prefijos_obligatorios:
    Panamá: ["provincia de"]
    # D-110: nombres de lugar que también son nombres de persona o palabras comunes (David Beckham, ministro Herrera, «remedios»,
    # «la mesa», «Santiago» apóstol…): solo cuentan como lugar si los precede un prefijo locativo.
    Herrera: &locativos [en, de, del, desde, hacia, distrito de, provincia de, corregimiento de, ciudad de]
    David: *locativos
    Santiago: *locativos
    La Mesa: *locativos
    Remedios: *locativos
    Donoso: *locativos
    Renacimiento: *locativos
    San Francisco: *locativos
    San Lorenzo: *locativos
    Santa Isabel: *locativos
    Las Palmas: *locativos
    Las Minas: *locativos
    Atalaya: *locativos
    Montijo: *locativos
  # E1-10c (X42): un término de `nacional_implicito_terminos` no cuenta si lo precede alguno de estos prefijos.
  prefijos_excluidos:
    Panamá: ["ciudad de", "provincia de", "distrito de"]
  # X51: sin tilde, un término de lugar no cuenta si lo sigue una de estas palabras («pese a» y «pese al» son la locución concesiva, no el
  # distrito de Pesé). Escrito con su tilde («Pesé») siempre cuenta.
  sufijos_excluidos:
    Pesé: ["a", "al"]
  # X66: «Colón» es una provincia (no pide prefijo), pero «colon» sin tilde es el órgano («cáncer de colon») y «Cristóbal Colón» es la persona.
  requieren_tilde: [Colón]
  prefijos_excluidos_lugar:
    Colón: ["Cristóbal"]

medios:
  desconocidos: ["", "desconocido", "unknown", "n/a"]   # valores de `medio` que no identifican un medio (componente identificable de E)

cifras:                           # ¿el grupo trae cifras? (estado de evidencia: `oficial_obligatorio_si_hay_cifras`) y base de las contradicciones por cifras
  patron: '(?<![\w.,])(?P<numero>\d[\d.,]*\d|\d)(?:\s*(?P<unidad>%|[^\W\d_]+))?'
  patron_fecha: '\b\d{1,2}\s+de\s+(?:enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)\b'
  anio_desde: 1900                # un entero entre estos años, sin `%`, es un año y no una cifra
  anio_hasta: 2100
  digitos_por_grupo_de_miles: 3   # «84.000» son 84 mil; «3,2» y «3.5» son decimales
  palabras_previas_no_cifra: [ley, decreto, resolucion, articulo, numero, "no", fase, grupo, covid, expediente, proyecto]
  unidades_ignoradas: [de, del, la, el, los, las, en, a, al, y, o, por, para, con, que, se, es, son, han, fue, ha, un, una]
  raiz_unidad_caracteres: 5       # «escuela» y «escuelas» comparten raíz; una unidad más corta se usa entera

contradicciones:
  etiqueta: "posible contradicción, verificar"   # única forma en que se presenta; nunca un veredicto (D-23)
  solo_entre_procedencias: false  # true: dos titulares de la misma procedencia (misma agencia o medio) no se comparan. false: dos versiones distintas de un mismo origen también se muestran
  maximo_candidatos_por_grupo: 6  # tope de pares que se comparan con el LLM (costo y contexto)
  prompt: comparar_contradicciones
  # Verbos opuestos (sin tildes, minúsculas, palabra completa). Un par es candidato si un titular usa una forma del lado `a` y otro del lado `b`.
  pares_opuestos:
    - nombre: sube / baja
      a: [sube, suben, subio, subieron, aumenta, aumentan, aumento, aumentaron, crece, crecen, crecio, crecieron, incrementa, incrementan, rises, rise, rose, climbs, climbed, jumps, jumped, surges, surged]
      b: [cae, caen, cayo, cayeron, disminuye, disminuyen, disminuyo, descendio, desciende, reduce, reducen, redujo, falls, fall, fell, drops, dropped, declines, declined, plunges, plunged]
    - nombre: aprueba / rechaza
      a: [aprueba, aprueban, aprobo, aprobaron, approves, approved, acepta, aceptan, acepto]
      b: [rechaza, rechazan, rechazo, rechazaron, veta, vetan, veto, archiva, archivan, archivo, rejects, rejected, vetoes, vetoed]
    - nombre: confirma / niega
      a: [confirma, confirman, confirmo, confirmaron, confirms, confirmed]
      b: [niega, niegan, nego, negaron, desmiente, desmienten, desmintio, denies, denied, refutes, refuted]
    - nombre: abre / cierra
      a: [abre, abren, abrio, abrieron, reabre, reabren, reabrio, opens, opened, reopens, reopened]
      b: [cierra, cierran, cerro, cerraron, closes, closed]
    - nombre: suspende / reanuda
      a: [suspende, suspenden, suspendio, suspendieron, suspends, suspended]
      b: [reanuda, reanudan, reanudo, reanudaron, resumes, resumed]
    - nombre: gana / pierde
      a: [gana, ganan, gano, ganaron, wins, won]
      b: [pierde, pierden, perdio, perdieron, loses, lost]
    - nombre: condena / absuelve
      a: [condena, condenan, condeno, condenaron, convicts, convicted]
      b: [absuelve, absuelven, absolvio, absolvieron, acquits, acquitted]

vacios:                           # textos de los vacíos de verificación (plantillas con {campos})
  procedencias_insuficientes: "{procedencias}; se necesitan al menos {minimo} para evidencia suficiente"
  cifras_sin_dato_oficial: "los titulares traen cifras y no hay dato oficial vinculado"
  sin_dato_oficial: "sin dato oficial vinculado ({motivo})"
  contradiccion_abierta: "posible contradicción, verificar: {n} par(es) de titulares con versiones distintas"
  medios_o_fechas_desconocidos: "{n} de {total} titulares sin medio o fecha de publicación conocidos"
  solo_vinculo_indirecto: "sin dato oficial vinculado (solo vínculo indirecto: no mide el hecho)"
  cifra_discrepante: "la cifra de un titular difiere de la oficial vinculada ({ids}): posible discrepancia, verificar"
  cifra_periodo_distinto: "la cifra de un titular corresponde a un período distinto del dato oficial vinculado ({ids}): no es comparable"
  evento_sin_revisar: "el evento oficial vinculado ({ids}) tiene estado automático: puede cambiar al ser revisado"
  noticia_recirculada: "noticia recirculada: publicada originalmente el {fecha}; no se trata como nueva"
  tema_desconocido: "tema no determinado: se usó el alcance neutro de impacto"
  sector_desconocido: "sector no determinado: el tema del grupo no tiene sector y se usó el alcance neutro de impacto"
  motivo_sin_dato_oficial_por_defecto: "no hay un vínculo definido para este tema en la tabla de contexto"
  motivos_sin_vinculo:            # `vinculos.motivo_sin_vinculo` dicho en palabras: ningún código interno llega a la ficha
    tema_sin_indicador: "el tema no tiene un indicador oficial asignado"
    sin_dato_en_periodo: "el indicador oficial no tiene valor en el período"
    sin_evento_coincidente: "no hay un evento oficial cercano en el tiempo"
    fuera_de_cobertura: "el tema está fuera de la cobertura de las fuentes oficiales"
    candidatos_ambiguos: "hay varios eventos oficiales posibles y no se eligió ninguno"

sensibilidad:                     # eval/sensibilidad.py
  variacion_peso: 5               # puntos de peso (PDF: «permitir justificar cambios de pesos»)
  variacion_supuesto: 0.2         # ±20 % de cada parámetro supuesto (spec E1-10)
  tamano_ranking: 5               # top 5 (CU-01)

puntaje_eval:                     # eval/puntaje.py
  casi_constante_desviacion: 0.05 # un componente con desviación estándar menor a esto casi no ordena (se marca)
  top_en_reporte: 10              # filas del ranking en outputs/prioridad.json
