# E1-13 · Validador de citas (D-41, D-45, D-51, D-53, D-68). Todo umbral y toda lista de reglas viven aquí (D-79).
# Las listas de frases prohibidas (entrevistas, imágenes, lectura simulada, sensacionalismo) están en restricciones.yaml; los
# límites de palabras y cantidades, en salidas.yaml. Origen y validación de cada valor: docs/parametros.md, sección E1-13.
# Las comparaciones no distinguen mayúsculas ni tildes y se hacen por palabra completa.
version: "1.0"

registro: outputs/rechazos.jsonl     # una línea por rechazo y una por unidad evaluada (permite calcular tasas)

numeros:
  tolerancia_absoluta: 0.0           # diferencia máxima entre la cifra del texto y la del campo citado
  redondeo_permitido: true           # «2.9 %» respalda el valor 2.934: la cifra del texto es el valor redondeado a sus decimales
  decimales_minimos: 1               # el redondeo y la tolerancia relativa exigen al menos un decimal escrito: «2 %» nunca respalda 1.5
  tolerancia_relativa: 0.01          # con decimales escritos, «1,49 %» respalda 1.5 (diferencia ≤ 1 % del valor citado)
  decimales_maximos: 6               # más decimales que esto en el texto no se comparan por redondeo

# D-41: una hipótesis y una redacción condicional llevan alguno de estos marcadores.
condicionales: [podría, podrían, pudiera, pudieran, es posible, sería, serían, habría, quizá, quizás, tal vez, posiblemente,
                a verificar, por verificar, por confirmar, a confirmar, no se descarta, de confirmarse, de ser cierto, eventualmente,
                si se confirma, en caso de,
                # X63: expectativa y probabilidad también hacen condicional una redacción: una observación no puede traerlas (y una hipótesis sí)
                probablemente, es probable que, previsiblemente, es previsible que, se espera que, se prevé que, se anticipa que]

# D-68: conectores causales. Solo se aceptan si están literalmente en el titular citado (declaración atribuida) o en una hipótesis condicional.
causales: [causó, causaron, provocó, provocaron, ocasionó, ocasionaron, originó, originaron, desencadenó, generó, debido a, por culpa de,
           a raíz de, a causa de, por causa de, como consecuencia de, como resultado de, porque, ya que, gracias a, producto de, motivó,
           por lo que, dado que, por eso, fruto de, derivó en, lo que provocó, lo que llevó a, a consecuencia de, impulsado por,
           como efecto de, lo que causó, lo que generó, de ahí que, puesto que]

# D-68: verbos y adjetivos de acusación o culpa. Solo como declaración atribuida a un medio y presentes en el titular citado.
# Se comparan CON tildes: «robó» (verbo) y «robo» (sustantivo) son entradas distintas. Incluye participios, infinitivos y sustantivos, para que
# una hipótesis en condicional («habría malversado», «podría haber robado») o una inferencia nominal («corrupción de X») no escape (X29).
acusaciones: [robó, robaron, roba, roban, robado, robada, robados, robar, robo, asesinó, asesinaron, asesinado, asesinar, asesinato, mató,
              estafó, estafaron, estafado, estafar, estafa, defraudó, defraudado, defraudar, fraude, fraudulento, malversó, malversado, malversar,
              malversación, sobornó, sobornado, sobornar, soborno, peculado, desfalco, desfalcó, secuestró, secuestrado, violó, violado, es culpable,
              son culpables, culpable, culpables, corrupto, corrupta, corruptos, corruptas, corrupción, ladrón, ladrones, criminal, delincuente,
              mintió, miente, traidor, mafioso, implicado en, implicada en, implicados en, implicadas en, involucrado en, involucrada en]

# D-51: detalles sin cita (confirmaciones y fuentes que la evidencia no trae). Solo si están literalmente en un titular citado.
detalle_sin_cita: [fuentes confirmaron, fuentes oficiales confirmaron, fuentes oficiales, fuentes cercanas, fuentes aseguran, confirmaron,
                   se confirmó, testigos, según expertos, los expertos, según analistas, los analistas]

# Patrones (regex sobre texto sin tildes ni mayúsculas) que se suman a las frases de cada lista de restricciones.yaml (M1).
patrones:
  # X50: recomendaciones de acción sobre el crédito sin «comprar» ni «vender»; y certeza al abrir la oración («De seguro…»)
  recomendacion: ['\bdeberia(n|mos)? (limitar|reducir|aumentar|recortar|evitar|suspender|restringir|ampliar|vender|comprar|invertir|retirar|disminuir|incrementar|frenar|congelar|endurecer|flexibilizar)\b',
                  # X62: «sería / podría ser / resultaría + oportuno…» recomienda sin usar «recomendar»
                  '\b(seria|podria ser|resultaria|podria resultar) (mas )?(oportuno|conveniente|prudente|recomendable|aconsejable|razonable)\b']
  certeza: ['(^|[.;:!?¿¡]\s*)de seguro\b']
  # X62: futuro asertivo general, sobre el texto CON tildes (lista `con_tildes`): «va a + infinitivo» y el futuro simple en -rá/-rán
  # («se desplomará», «sufrirá», «habrá»). Una hipótesis de impacto se redacta en condicional, nunca en futuro indicativo.
  futuro_asertivo: ['\bvan? a \w{2,}(ar|er|ir)(se)?\b', '\b\w{2,}r(á|án)\b']
  lectura_simulada: ['\b(articulo|nota|reportaje|texto|noticia|cronica|informe)\s+(explica|detalla|senala|indica|revela|cuenta|menciona|describe|asegura|precisa|advierte)\b', '\bsegun (el|la) (articulo|nota|reportaje|texto|noticia|cronica)\b']
  entrevistas: ['\b(dijo|declaro|aseguro|conto|afirmo|explico|revelo) a (tvn|la prensa|los medios|los periodistas|este medio|nuestro medio|la estrella|telemetro|critica)\b']

# Números escritos con palabras (M1): se convierten a cifra y deben coincidir con la evidencia como cualquier cifra.
palabras_numero: {cero: 0, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7, ocho: 8, nueve: 9, diez: 10, once: 11, doce: 12, trece: 13, catorce: 14,
                  quince: 15, dieciseis: 16, diecisiete: 17, dieciocho: 18, diecinueve: 19, veinte: 20, veintiuno: 21, veintidos: 22, veintitres: 23,
                  veinticuatro: 24, veinticinco: 25, veintiseis: 26, veintisiete: 27, veintiocho: 28, veintinueve: 29, treinta: 30, cuarenta: 40,
                  cincuenta: 50, sesenta: 60, setenta: 70, ochenta: 80, noventa: 90, cien: 100, ciento: 100, doscientos: 200, trescientos: 300,
                  cuatrocientos: 400, quinientos: 500, seiscientos: 600, setecientos: 700, ochocientos: 800, novecientos: 900}
numerales_en_compuesto: {un: 1, uno: 1, una: 1}   # «un plan» no es una cifra; «treinta y uno» sí
multiplicadores: {mil: 1000, millon: 1000000, millones: 1000000}
# Cantidades sin cifra exacta: solo se admiten si el titular citado (o la afirmación de apoyo) las trae literales.
cantidades_vagas: [miles de, decenas de, cientos de, centenares de, docenas de, millones de, la mitad, el doble, el triple, un tercio, la tercera parte,
                   la mayoria de, casi todos]

# M4: juicios de valor que una transición sin cita no puede llevar.
juicios_transicion: [mala noticia, buena noticia, preocupante, preocupa, preocupan, preocupacion, grave, gravisimo, lamentable, positivo, negativo,
                     alarma, inquieta, inquietante, peligroso, afortunadamente, desafortunadamente, por desgracia, sin duda, claramente,
                     evidentemente, obviamente, injusto, escandaloso, importante, relevante, urgente]

# Traducción (D-45): equivalencias que una cita de un titular en otro idioma legitima. Una entidad ausente del titular y de esta tabla se rechaza.
equivalencias_traduccion:
  América Latina: [Latin America, LatAm]
  Autoridad del Canal de Panamá: [Panama Canal Authority]
  Autoridad: [Authority]
  Ciudad de Panamá: [Panama City]
  Canal de Panamá: [Panama Canal]
  Estados Unidos: [United States, US, USA, U.S.]
  Reino Unido: [United Kingdom, UK, Britain]
  Naciones Unidas: [United Nations]
  Unión Europea: [European Union]
  Medio Oriente: [Middle East]
  Banco Mundial: [World Bank]
  Fondo Monetario Internacional: [International Monetary Fund, IMF]
  Casa Blanca: [White House]
  Asamblea Nacional: [National Assembly]
cognados_prefijo_min: 5     # en un titular traducido, un nombre que comparte este prefijo con una palabra del titular es la misma entidad (Singapur / Singapore)

# X33: el país y la fuente de un dato oficial salen de su ID (IND-<ISO3>-…); los nombres de país son los de consulta.yaml (datos_oficiales.nombres_pais).
fuentes_por_prefijo: {IND: Banco Mundial, SIS: USGS, SBP: SBP}
# Frases con un numeral que no es una cifra (las dos versiones de una contradicción).
frases_sin_cifra: [las dos versiones, ambas versiones, las dos partes, las dos posturas]

# Cómo se aplica cada lista de config/restricciones.yaml (la clave es el nombre de la lista; también es el nombre de la regla).
#  tipos: solo se aplica a oraciones o afirmaciones de estos tipos (vacío = a todo)
#  excepcion_literal: se permite si la frase está literalmente en un titular citado
#  sin_excepcion_en: secciones donde la excepción no vale
#  excepcion_tipos: la excepción solo vale si lo que se cita es de estos tipos (vacío = cualquiera)
#  ventana_literal: además de la frase, estas palabras a cada lado (las que haya en el texto) deben ser literales del titular citado (X49)
#  rechaza_sector_financiero_ajeno: una oración que usa la excepción literal se rechaza si trae un término de `sector_financiero` que el campo citado no trae (X57, D-107)
#  con_tildes: se compara conservando tildes («bajará» no es «bajara»)
listas:
  lectura_simulada: {excepcion_literal: false}
  sensacionalistas: {excepcion_literal: true, sin_excepcion_en: [titulo, titulo_trabajo, titulares, copy_digital]}
  entrevistas: {excepcion_literal: true}
  imagenes: {excepcion_literal: false}
  recomendacion: {excepcion_literal: false}
  # E2-02 (D-54): la certeza se rechaza en todo lo que el boletín muestra como hipótesis de impacto (inferencia e hipótesis); el léxico
  # de pérdidas, impagos o exposición se rechaza en todo tipo salvo en una declaración que lo trae literal en su titular.
  certeza: {excepcion_literal: false, tipos: [inferencia, hipótesis]}
  futuro_asertivo: {excepcion_literal: false, tipos: [inferencia, hipótesis], con_tildes: true}   # X50: un futuro indicativo afirma, no condiciona
  # X49: la palabra sola no basta; el fragmento que la rodea (2 palabras a cada lado) debe estar literal en el titular citado.
  perdidas_en_inferencias: {excepcion_literal: true, excepcion_tipos: [declaración], ventana_literal: 2, rechaza_sector_financiero_ajeno: true}

# X57 (D-107): términos del sector financiero (palabras completas, sin distinguir mayúsculas ni tildes). Una oración que se apoya en la excepción
# del titular literal (`perdidas_en_inferencias`) no puede traer ninguno que el campo citado no tenga: la ventana de 2 palabras no alcanza para
# impedir «…causaron pérdidas en cultivos y en la banca».
sector_financiero:
  - banca
  - banco
  - bancos
  - bancario
  - bancaria
  - bancarios
  - bancarias
  - crédito
  - créditos
  - cartera
  - carteras
  - préstamo
  - préstamos
  - entidad financiera
  - entidades financieras
  - institución financiera
  - instituciones financieras
  - sistema financiero
  - sector financiero
  - financiera
  - financieras
  - financiero
  - financieros

# D-41: oraciones sin cita (transiciones). Sin cifras, fechas, nombres ni entidades; el máximo por sección está en salidas.yaml.
transiciones:
  max_palabras: 15
  secciones: [brief, resumen_web, guion]
  # Una palabra con mayúscula inicial que abre una oración no es un nombre por sí sola; estas nunca lo son.
  inicio_no_entidad: [el, la, los, las, un, una, unos, unas, esto, eso, esta, este, estos, estas, además, también, por, con, sin, pero, así,
                      ahora, entonces, mientras, sobre, para, en, de, y, o, a, cuando, como, donde, aunque, sin embargo, lo, se, es, hay]

# Nombres de lugar que no cuentan como «nombre nuevo» aunque la evidencia citada no los traiga (el caso es sobre Panamá).
nombres_permitidos: [Panamá]

# Meses (para detectar fechas del texto) y tamaño mínimo de un nombre propio.
meses: [enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, setiembre, octubre, noviembre, diciembre]
nombre_min_caracteres: 2

# D-45: campos de la evidencia que son fechas (clave que contiene alguna de estas cadenas, comparada sin tildes) y el campo del año.
campos_fecha: [fecha, anio, año]

# E2-02 · Boletín de entorno (docs/salidas.md §2): qué tipos de afirmación puede citar cada bloque del resumen. Una observación nunca se
# apoya en una inferencia o hipótesis; una hipótesis de impacto solo en ellas y siempre en condicional (marcadores de `condicionales`).
bloques_boletin:
  observaciones: [hecho, declaración]
  hipotesis_impacto: [inferencia, hipótesis]
  ventana_literal_condicional: 2   # X49: una observación no va en condicional, salvo que el marcador y 2 palabras a cada lado sean literales del titular
