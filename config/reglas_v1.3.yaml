# Reglas de puntaje v1.3 (D-35, D-56). Cada número está en docs/parametros.md con su origen.
# El código solo lee estos valores; cambiar uno cambia P sin tocar src/ (E1-05).
version: "1.3"

pesos:                      # suman 100 (PDF sección 4)
  R: 30                     # relevancia
  I: 25                     # impacto
  U: 20                     # urgencia
  N: 15                     # novedad
  E: 10                     # evidencia

rangos:                     # [desde, hasta): el último incluye su límite superior
  bajo:  {desde: 0,  hasta: 40}
  medio: {desde: 40, hasta: 70}
  alto:  {desde: 70, hasta: 100}

desempate: [u_desc, id_asc]  # mayor U; si empatan, menor ID

# D-103: ni R ni N usan ya percentiles de similitud (antes D-35: «percentil dentro del snapshot»).

relevancia:                 # R = peso_foco × foco. D-103 quitó la parte temática (confianza del clasificador) y renormalizó
  peso_foco: 1.0            # antes 0.5 foco + 0.5 percentil(similitud temática); la única parte que queda pesa 1
  foco_panama_sujeto: 1.0
  foco_otro_pais_afecta: 0.5

impacto:                    # I = peso_subtema × alcance(subtema) + peso_geografico × alcance geográfico
  peso_subtema: 0.5         # el dato oficial y las procedencias NO entran en I (D-15, D-35)
  peso_geografico: 0.5
  alcance_geografico: {nacional: 1.0, provincial: 0.6, local: 0.3, desconocido: 0.3}   # D-109: desconocido = local (antes 0.5, neutro)
  # Alcance por subtema (criterio editorial, supuesto). Las claves son los subtemas de temas.yaml.
  alcance_subtema:
    crecimiento_pib: 1.0
    inflacion_precios: 1.0
    empleo: 0.8
    finanzas_publicas: 0.8
    inversion: 0.6
    comercio_exterior: 0.6
    banca_calificaciones: 0.6
    operacion_canal: 1.0
    puertos: 0.8
    zona_libre: 0.6
    carga_aerea: 0.6
    transporte_carga: 0.6
    cadenas_suministro: 0.6
    llegada_visitantes: 0.6
    cruceros: 0.6
    hoteleria: 0.5
    aviacion_pasajeros: 0.6
    destinos_promocion: 0.4
    agua_potable: 1.0
    electricidad: 1.0
    telecomunicaciones: 0.8
    transporte_publico: 0.8
    recoleccion_basura: 0.6
    salud_publica: 1.0
    educacion_publica: 1.0
    seguridad_ciudadana: 0.8
    sismos: 1.0
    inundaciones_lluvias: 0.8
    deslizamientos: 0.6
    sequia_nino: 1.0
    incendios_forestales: 0.6
    alertas_proteccion_civil: 0.8
    leyes_decretos: 1.0
    resoluciones_entes: 0.8
    reformas: 1.0
    listas_internacionales: 1.0
    contratos_concesiones: 0.8
    sanciones: 0.6

urgencia:                   # U usa la publicación original MÁS RECIENTE del grupo
  # D-106: U = fracción de la ventana de revisión que queda («tiempo disponible para revisar», PDF sección 4): lineal de 1 al
  # publicarse a 0 al cerrarse la ventana. Antes (v1.3) U valía 1 durante las primeras 24 h y se saturaba (2 h = 30 h).
  horas_pleno: 0            # D-106: sin meseta (antes 24); publicada hace estas horas o menos -> U = 1
  dias_nulo: 7              # hace estos días o más -> U = 0; lineal entre ambos
  # Sin fecha_publicacion en ningún titular (todo GDELT): se usa fecha_deteccion como cota y se agrega este vacío.
  fecha_sin_publicacion: fecha_deteccion
  vacio_sin_publicacion: "urgencia estimada: fecha de publicación desconocida"

novedad:                    # D-103: s = similitud máxima con un titular de un grupo anterior; u = agrupacion.umbral_similitud
  # N = 1 si s < u (no es el mismo evento: no se descuenta); si s ≥ u, N = (1 − s) / (1 − u), lineal de 1 (en el umbral)
  # a 0 (duplicado exacto). El umbral es el MISMO con que se agrupa (no se copia aquí).
  sin_grupos_previos: 1.0   # el primer grupo no tiene con qué compararse

evidencia:                  # E (v1.3, D-56)
  peso_procedencias: 0.5
  peso_oficial: 0.3
  peso_identificables: 0.2  # proporción de titulares con medio y fecha de publicación conocidos
  tope_procedencias: 3

estado_evidencia:           # independiente de P
  procedencias_suficiente: 2
  procedencias_parcial_con_oficial: 1   # diseño: parcial = 2+ procedencias, o 1 procedencia + dato oficial
  oficial_obligatorio_si_hay_cifras: true
  sin_contradiccion_abierta_para_suficiente: true   # diseño: suficiente = 2+ procedencias, sin contradicción abierta y cifras con dato oficial

agrupacion:                 # E1-08 · AgglomerativeClustering(metric='cosine', linkage='average'); distance_threshold = 1 − umbral_similitud
  ventana_dias: 7           # dos titulares separados por más días no se unen (se parte el grupo, no se mueve el umbral)
  prefijo_id: "GRP-"        # D-63: GRP- = hash de los NOT- del grupo, ordenados
  largo_hash_id: 10         # caracteres del SHA-1 (el mismo largo que NOT-, normalizacion.yaml)
  separador_ids: "|"        # une los NOT- ordenados antes del hash
  modelo: minilm            # modelo de clasificacion.yaml con el que se agrupa y con el que se calibró el umbral (no vale para otro)
  umbral_similitud: 0.69    # coseno promedio mínimo para unir; lo fija `python -m eval.agrupacion` (barrido de F1 de pares, D-16)
  umbral_mismo_texto: 0.95  # procedencias: misma nota republicada
  usar_descripcion: false   # se agrupa por titular: la descripción del RSS es de uso interno y los grupos se etiquetaron por titular
  campos_fecha: [fecha_publicacion, fecha_deteccion]   # prioridad al fechar un titular; la detección solo es una cota: la ventana de D-74 se mide sobre ella
  calibracion:
    barrido_desde: 0.50
    barrido_hasta: 0.99
    barrido_paso: 0.005
    pliegues: 2             # partición determinista por hash del id: se calibra en un pliegue y se mide en el otro

# Agencias de noticias para clasificar el TIPO de firma sin guardar nombres de personas (D-32).
# El RSS de TVN no trae firma: solo sirve si un titular de GDELT la nombra.
agencias: [EFE, AFP, AP, Reuters, Europa Press, DPA, ANSA, Xinhua, Prensa Latina, Bloomberg]

geografia:                  # alcance geográfico (comparación sin tildes ni mayúsculas, E1-10)
  nacional_terminos: [a nivel nacional, todo el país, en todo el país, nacional, asamblea nacional, gobierno nacional]
  # E1-10c (X42, D-108): mención implícita del país. El país nombrado («en Panamá», «en el país», «del país») o su gentilicio
  # («panameño/a/s») da alcance nacional SOLO si ningún titular del grupo nombra un lugar concreto (provincia, comarca o
  # distrito): el lugar nombrado ubica el hecho. Los términos explícitos de arriba mandan siempre. «Panamá» precedido de «ciudad
  # de» o «provincia de» no es el país (prioridad.yaml: prefijos_excluidos). D-108: una institución nacional SOLA (CSS, Minsa,
  # MOP, ACP, AMP, el Ejecutivo, los órganos del Estado…) NO da alcance nacional: no prueba que el hecho sea de todo el país.
  nacional_implicito_terminos: [Panamá, panameño, panameña, panameños, panameñas, en el país, del país]
  provincias: [Bocas del Toro, Chiriquí, Coclé, Colón, Darién, Herrera, Los Santos, Panamá, Panamá Oeste, Veraguas]
  comarcas: [Guna Yala, Emberá-Wounaan, Ngäbe-Buglé, Madugandí, Wargandí, Naso Tjër Di]
  distritos:
    # X52: la capital es un lugar concreto (local), no el país: «MOP inaugura obra en Ciudad de Panamá» no es nacional.
