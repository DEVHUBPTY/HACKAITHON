# Reglas de puntaje v1.3 (D-35, D-56). Cada número está en docs/parametros.md con su origen.
# El código solo lee estos valores; cambiar uno cambia P sin tocar src/ (E1-05).
version: "1.3"

pesos:                      # suman 100 (PDF sección 4)
  R: 30                     # relevancia
  I: 25                     # impacto
  U: 20                     # urgencia
  N: 15                     # novedad
  E: 10                     # evidencia

rangos:                     # [desde, hasta): el último incluye su límite superior
  bajo:  {desde: 0,  hasta: 40}
  medio: {desde: 40, hasta: 70}
  alto:  {desde: 70, hasta: 100}

desempate: [u_desc, id_asc]  # mayor U; si empatan, menor ID

# D-103: ni R ni N usan ya percentiles de similitud (antes D-35: «percentil dentro del snapshot»).

relevancia:                 # R = peso_foco × foco × pertenencia temática. D-103 quitó la parte temática basada en la CONFIANZA del clasificador;
  peso_foco: 1.0            # D-119 la restituye de otra forma: pertenencia DISCRETA según la ETIQUETA (nunca la confianza) a los temas de la modalidad
  foco_panama_sujeto: 1.0
  foco_otro_pais_afecta: 0.5
  pertenencia_tematica:     # "Relación con Panamá y con los temas de la modalidad" (PDF sección 4). Temas = los 6 de config/temas.yaml
    tema_principal: 1.0     # algún titular del grupo tiene un tema de la modalidad como tema_clasificado
    solo_secundario: 0.6    # ninguno lo tiene como principal, pero alguno lo tiene como tema_secundario
    sin_tema: 0.3           # ninguno (etiqueta nula, no_es_panama, fuera_de_temas o no_es_noticia): baja el orden sin anular el grupo

impacto:                    # D-125: I = peso_tema × alcance(tema) + peso_geografico × alcance geográfico (el reto define 6 temas y ningún subtema)
  peso_tema: 0.5            # el dato oficial y las procedencias NO entran en I (D-15, D-35); mismo reparto que tenía con el subtema
  peso_geografico: 0.5
  alcance_geografico: {nacional: 1.0, provincial: 0.6, local: 0.3, desconocido: 0.3, exterior: 0.3}   # D-109: desconocido = local (antes 0.5, neutro) · D-115: exterior = local
  # Alcance por tema (criterio editorial, supuesto heredado). Cada valor es el PROMEDIO, redondeado a 2 decimales, del alcance
  # por subtema que usaba la versión anterior (D-125) para los subtemas del tema: economía 5.4/7, logística 4.2/6, turismo 2.7/5,
  # servicios públicos 7.8/9, eventos naturales 4.8/6, regulación 5.2/6. Detalle y origen: docs/parametros.md.
  alcance_tema:
    economia: 0.77
    logistica: 0.70
    turismo: 0.54
    servicios_publicos: 0.87
    eventos_naturales: 0.80
    regulacion: 0.87

urgencia:                   # U usa la publicación original MÁS RECIENTE del grupo
  # D-106: U = fracción de la ventana de revisión que queda («tiempo disponible para revisar», PDF sección 4): lineal de 1 al
  # publicarse a 0 al cerrarse la ventana. Antes (v1.3) U valía 1 durante las primeras 24 h y se saturaba (2 h = 30 h).
  horas_pleno: 0            # D-106: sin meseta (antes 24); publicada hace estas horas o menos -> U = 1
  dias_nulo: 7              # hace estos días o más -> U = 0; lineal entre ambos
  # Sin fecha_publicacion en ningún titular (todo GDELT): se usa fecha_deteccion como cota y se agrega este vacío.
  fecha_sin_publicacion: fecha_deteccion
  vacio_sin_publicacion: "urgencia estimada: fecha de publicación desconocida"
  # D-124: la detección es igual o posterior a la publicación; con ella el grupo se ve más nuevo de lo que es. U se topa en este valor
  # (supuesto conservador: la mitad de la escala) y la explicación marca `fecha_imputada`. Nunca se presenta como publicación.
  tope_fecha_imputada: 0.5

novedad:                    # D-124 (reemplaza a D-103): N continua entre dos anclas a priori
  # s = similitud coseno entre el CENTROIDE del grupo y el de cada grupo que empezó ANTES y dentro de `ventana_dias` (la
  # fecha de inicio es la del titular más antiguo: publicación y, si falta, detección). Se toma la máxima.
  # N = 1 si s <= ancla_baja; N = 0 si s >= ancla_alta; lineal entre ambas. ancla_alta = agrupacion.umbral_similitud (arriba
  # de él el agrupamiento habría unido los dos grupos: sería el mismo evento); no se copia aquí. Una duplicación nunca sube N.
  sin_grupos_previos: 1.0   # sin ningún grupo anterior dentro de la ventana, N = este valor
  ventana_dias: 7           # supuesto: la misma ventana con que se agrupa (agrupacion.ventana_dias); más lejos ya no es repetición
  ancla_baja: 0.50          # supuesto a priori: extremo inferior del barrido de calibración (agrupacion.calibracion.barrido_desde); por debajo no es candidato a mismo evento. NO se ajustó para que N se vea distribuido

evidencia:                  # E (v1.3, D-56)
  peso_procedencias: 0.5
  peso_oficial: 0.3
  peso_identificables: 0.2  # proporción de titulares con medio y fecha de publicación conocidos
  tope_procedencias: 3

estado_evidencia:           # independiente de P
  procedencias_suficiente: 2
  procedencias_parcial_con_oficial: 1   # diseño: parcial = 2+ procedencias, o 1 procedencia + dato oficial
  oficial_obligatorio_si_hay_cifras: true
  sin_contradiccion_abierta_para_suficiente: true   # diseño: suficiente = 2+ procedencias, sin contradicción abierta y cifras con dato oficial

agrupacion:                 # E1-08 · AgglomerativeClustering(metric='cosine', linkage='average'); distance_threshold = 1 − umbral_similitud
  ventana_dias: 7           # dos titulares separados por más días no se unen (se parte el grupo, no se mueve el umbral)
  prefijo_id: "GRP-"        # D-63: GRP- = hash de los NOT- del grupo, ordenados
  largo_hash_id: 10         # caracteres del SHA-1 (el mismo largo que NOT-, normalizacion.yaml)
  separador_ids: "|"        # une los NOT- ordenados antes del hash
  modelo: minilm            # modelo de clasificacion.yaml con el que se agrupa y con el que se calibró el umbral (no vale para otro)
  umbral_similitud: 0.69    # coseno promedio mínimo para unir; lo fija `python -m eval.agrupacion` (barrido de F1 de pares, D-16)
  umbral_mismo_texto: 0.95  # procedencias: misma nota republicada
  usar_descripcion: false   # se agrupa por titular: la descripción del RSS es de uso interno y los grupos se etiquetaron por titular
  campos_fecha: [fecha_publicacion, fecha_deteccion]   # prioridad al fechar un titular; la detección solo es una cota: la ventana de D-74 se mide sobre ella
  calibracion:
    barrido_desde: 0.50
    barrido_hasta: 0.99
    barrido_paso: 0.005
    pliegues: 2             # partición determinista por hash del id: se calibra en un pliegue y se mide en el otro

# Agencias de noticias para clasificar el TIPO de firma sin guardar nombres de personas (D-32).
# El RSS de TVN no trae firma: solo sirve si un titular de GDELT la nombra.
agencias: [EFE, AFP, AP, Reuters, Europa Press, DPA, ANSA, Xinhua, Prensa Latina, Bloomberg]

geografia:                  # alcance geográfico (comparación sin tildes ni mayúsculas, E1-10)
  # X85 (E1-10d): «nacional» suelto ya no da alcance nacional («Policía Nacional», «Guardia Nacional de Texas», «Banco Nacional»): solo las frases.
  nacional_terminos: [a nivel nacional, todo el país, en todo el país, en todo el territorio, territorio nacional, asamblea nacional, gobierno nacional]
  # E1-10c (X42, D-108): mención implícita del país. El país nombrado («en Panamá», «en el país», «del país») o su gentilicio
  # («panameño/a/s») da alcance nacional SOLO si ningún titular del grupo nombra un lugar concreto (provincia, comarca o
  # distrito): el lugar nombrado ubica el hecho. Los términos explícitos de arriba mandan siempre. «Panamá» precedido de «ciudad
  # de» o «provincia de» no es el país (prioridad.yaml: prefijos_excluidos). D-108: una institución nacional SOLA (CSS, Minsa,
  # MOP, ACP, AMP, el Ejecutivo, los órganos del Estado…) NO da alcance nacional: no prueba que el hecho sea de todo el país.
  nacional_implicito_terminos: [Panamá, panameño, panameña, panameños, panameñas, en el país, del país]
  # D-115 (E1-10d): países y ciudades grandes del exterior, en español e inglés (comparación sin tildes ni mayúsculas). Si los titulares de un
  # grupo nombran alguno y NINGÚN lugar de Panamá, el alcance es `exterior` (0.3). Un nombre más largo manda sobre el lugar panameño que contiene
  # («Santiago de Chile» no es el distrito de Santiago). Ver specs/E1-10d.md para la precedencia.
  exterior_terminos: [
    # países y territorios
    Afganistán, Afghanistan, Albania, Alemania, Germany, Andorra, Angola, Arabia Saudita, Arabia Saudí, Saudi Arabia, Argelia,
    Algeria, Argentina, Armenia, Australia, Austria, Azerbaiyán, Azerbaijan, Bahamas, Baréin, Bahrain, Bangladés, Bangladesh,
    Barbados, Bélgica, Belgium, Belice, Belize, Benín, Bielorrusia, Belarus, Birmania, Myanmar, Bolivia, Bosnia, Botsuana,
    Botswana, Brasil, Brazil, Bulgaria, Burkina Faso, Camboya, Cambodia, Camerún, Cameroon, Canadá, Catar, Qatar, Chile, China,
    Chipre, Cyprus, Colombia, Congo, Corea del Sur, South Korea, Corea del Norte, North Korea, Costa Rica, Costa de Marfil,
    Ivory Coast, Croacia, Croatia, Cuba, Dinamarca, Denmark, Ecuador, Egipto, Egypt, El Salvador, Emiratos Árabes Unidos,
    United Arab Emirates, Eslovaquia, Slovakia, Eslovenia, Slovenia, España, Spain, Estados Unidos, United States, EEUU, EE UU,
    USA, Estonia, Etiopía, Ethiopia, Filipinas, Philippines, Finlandia, Finland, Francia, France, Gabón, Grecia,
    Greece, Guatemala, Guyana, Haití, Honduras, Hungría, Hungary, Indonesia, Irak, Iraq, Irán, Irlanda, Ireland,
    Islandia, Iceland, Israel, Italia, Italy, Jamaica, Japón, Japan, Kazajistán, Kazakhstan, Kenia, Kenya, Kosovo,
    Kuwait, Letonia, Latvia, Líbano, Lebanon, Libia, Libya, Lituania, Lithuania, Luxemburgo, Luxembourg, Malasia, Malaysia,
    Malta, Marruecos, Morocco, México, Moldavia, Mónaco, Mongolia, Mozambique, Namibia, Nepal, Nicaragua, Níger, Nigeria,
    Noruega, Norway, Nueva Zelanda, Nueva Zelandia, New Zealand, Omán, Países Bajos, Netherlands, Holanda, Pakistán, Palestina,
    Palestine, Paraguay, Perú, Polonia, Poland, Portugal, Puerto Rico, Reino Unido, United Kingdom, Gran Bretaña, Great Britain,
    República Checa, Czech Republic, República Dominicana, Dominican Republic, Rumania, Romania, Rusia, Russia, Senegal, Serbia,
    Singapur, Singapore, Siria, Syria, Somalia, Sudáfrica, South Africa, Sudán, Suecia, Sweden, Suiza, Switzerland, Surinam,
    Tailandia, Thailand, Taiwán, Tanzania, Trinidad y Tobago, Túnez, Tunisia, Turquía, Ucrania, Ukraine, Uganda, Uruguay,
    Uzbekistán, Vaticano, Vatican, Venezuela, Vietnam, Yemen, Zambia, Zimbabue, Zimbabwe, Gaza, Cisjordania, West Bank, Hong Kong,
    # ciudades grandes
    Abu Dabi, Abu Dhabi, Accra, Addis Abeba, Ámsterdam, Ankara, Asunción, Atenas, Athens, Atlanta, Bagdad, Baghdad, Bangkok,
    Barcelona, Barranquilla, Beirut, Belgrado, Belgrade, Berlín, Bogotá, Boston, Brasilia, Bruselas, Brussels, Budapest,
    Buenos Aires, Cartagena de Indias, Caracas, Chicago, Ciudad de Guatemala, Ciudad de México, Copenhague, Copenhagen, Dallas,
    Dubái, Dublín, El Cairo, Cairo, Estambul, Istanbul, Estocolmo, Stockholm, Ginebra, Geneva, Hanoi, Helsinki, Ho Chi Minh,
    Houston, Jerusalén, Jerusalem, Johannesburgo, Johannesburg, Kiev, Kyiv, Kingston, La Habana, Havana, Lisboa, Lisbon,
    Londres, London, Los Ángeles, Madrid, Managua, Manila, Medellín, Miami, Milán, Montevideo, Moscú, Moscow, Mumbai, Múnich,
    Nairobi, Nueva Delhi, New Delhi, Nueva York, New York, Nueva Orleans, New Orleans, Oslo, Pekín, Beijing, París, Quito, Riad,
    Riyadh, Río de Janeiro, Roma, Rome, San Salvador, Santiago de Chile, Santo Domingo, São Paulo, Seúl, Seoul, Shanghái, Sídney,
    Sydney, Tegucigalpa, Teherán, Tehran, Tel Aviv, Tokio, Tokyo, Toronto, Varsovia, Warsaw, Viena, Vienna, Zúrich,
    # C-10 (D7): estados y provincias extranjeras no ambiguos. Quedan fuera los nombres con colisión real (Georgia: «Georgia Meloni» es una
    # persona; Washington: apellido o el gobierno de EE. UU.; Santiago: solo «Santiago de Chile»). India, Ghana, Guinea, Mali, Jordania y
    # Lima se restauraron por decisión del dueño (2026-10-07): ver docs/parametros.md.
    India, Ghana, Guinea, Mali, Jordania, Lima,
    Texas, California, Arizona, Quebec, Ontario, Alberta, Cataluña, Catalonia, Andalucía, Baviera, Bavaria, Jalisco, Sicilia, Sicily
  ]
  # C-10 (D6): cómo se nombra al país. Un titular que lo nombra como parte del hecho no suma su lugar o contraparte extranjera al exterior
  # («Panamá y Colombia firman acuerdo en Bogotá»). El gentilicio no cuenta (D-115); «Ciudad de Panamá» tampoco (prioridad.yaml: prefijos_excluidos).
  pais_terminos: [Panamá]
  # C-10 (D3): nombres propios con «Panamá» que cuentan como mención del país («Cobre Panamá: gobierno de Canadá negocia» no es exterior).
  panama_nombres_propios: [Canal de Panamá, Cobre Panamá]
  # C-10 (D6): lugares extranjeros cuyo nombre contiene el del país («Hurricane hits Panama City, Florida»). No son una mención del país:
  # cuentan como exterior y no como el lugar o el país de Panamá.
  panama_nombres_extranjeros: [Panama City, Panama City Beach]
  provincias: [Bocas del Toro, Chiriquí, Coclé, Colón, Darién, Herrera, Los Santos, Panamá, Panamá Oeste, Veraguas]
  comarcas: [Guna Yala, Emberá-Wounaan, Ngäbe-Buglé, Madugandí, Wargandí, Naso Tjër Di]
