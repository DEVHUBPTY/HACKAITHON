# Vínculos con evidencia oficial (etapa 3), tal como el diseño de solución "Vínculos con evidencia oficial".
# Un vínculo es CONTEXTO, nunca prueba de causa ni suma a I (D-15). Los indicadores deben existir en config/fuentes.yaml.
# D-125: el reto define 6 temas y ningún subtema. Un vínculo lo dispara una REGLA INTERNA (`reglas_vinculo`): tema del grupo +
# un término en algún titular. Las reglas no son categorías: no aparecen en la ficha, la interfaz ni las exportaciones, salvo
# como texto de la regla que creó el vínculo. Sin regla disparada no hay vínculo (D-127: nunca se fuerza por tema): `sin_relacion_sustentada` si el tema tiene reglas y `motivo_por_defecto` si no.
version: "1.0"

tipos_relacion:
  directa: "El indicador mide lo mismo que la regla de vínculo."
  indirecta: "El indicador es un contexto lejano del tema; no mide el hecho."
  evento: "Evento oficial (USGS) que puede coincidir en el tiempo con la noticia."

motivos_sin_vinculo: [tema_sin_indicador, sin_dato_en_periodo, sin_evento_coincidente, fuera_de_cobertura, candidatos_ambiguos, sin_relacion_sustentada]
motivo_por_defecto: tema_sin_indicador       # el tema no tiene ninguna regla de vínculo
motivo_sin_relacion: sin_relacion_sustentada # D-127: el tema sí tiene reglas, pero ningún titular las sustenta: no se fuerza la relación

ventana_coincidencia_dias: 2        # sismos: ± días entre evento USGS y noticia (supuesto)
pais_por_defecto: PAN

textos_regla:                       # D-125: lo que queda escrito en `vinculos.regla` cuando decide una regla interna
  disparada: "regla {regla}: término «{termino}» en el titular"
  ambigua: "reglas {reglas} del tema {tema} disparadas a la vez: no se elige ninguna"
  sin_relacion: "ninguna regla del tema {tema} se dispara: ningún titular sustenta una relación con un dato oficial, no se fuerza"

sismos:                             # E1-09b: presentación y textos fijos del vínculo con eventos USGS
  zona_horaria: America/Panama      # solo para mostrar; los datos siguen en UTC
  formato_hora: "%Y-%m-%d %H:%M"
  formato_hora_utc: "%Y-%m-%dT%H:%M:%SZ"   # ISO 8601 UTC de los datos
  decimales_horas: 2                # precisión de la diferencia en horas entre noticia y evento
  unidad_magnitud: "magnitud"       # unidad de la columna `valor` en `vinculos` (USGS no la fija en nuestro contrato)
  plantilla_regla: "Evento USGS a ± {dias} días de la noticia y magnitud mínima {magnitud_minima}."
  nota_fecha_deteccion: "Alguna noticia del grupo no tiene fecha de publicación: se usó su fecha de detección."
  limitaciones:
    - "El lugar puede estar fuera de territorio panameño: se muestra tal como lo da USGS."
    - "La fuente solo describe el evento sísmico; no informa daños ni pérdidas."
    - "Un evento con estado automático puede cambiar al ser revisado."
  # D-127: si el titular nombra un sismo y ningún evento coincide en el tiempo, el catálogo de USGS (periodo fijo del reto: 2024) se
  # muestra como CONTEXTO histórico (`indirecta`): cuántos eventos hubo y el mayor. No es el evento de la noticia.
  contexto_historico:
    rol: contexto_historico         # valor de `vinculos.rol` de la fila
    relacion: indirecta             # clave de `tipos_relacion`: no mide el hecho y no cuenta como dato oficial en E
    plantilla_regla: "Regla {regla}: el titular nombra un sismo y ningún evento de USGS coincide en el tiempo; se muestra el catálogo {periodo} de la caja regional (magnitud mínima {magnitud_minima}) como contexto."
    limitaciones:
      - "La caja regional no equivale al territorio de Panamá: el lugar se muestra tal como lo da USGS."
      - "Periodo {periodo}, no coincide con la fecha de la noticia: no es el evento de la noticia."
      - "La fuente solo describe eventos sísmicos; no informa daños ni pérdidas."

# E3-02 · series agregadas del sistema bancario de la SBP (src/contexto_sbp.py), solo para reglas con `fuente: sbp`. Son datos
# MENSUALES de 2024 (config/fuentes.yaml: sbp), no el mes de la noticia: la nota de cada fila lo dice.
sbp:
  plantilla_regla: "Regla {regla}: último período con valor de cada serie agregada del sistema bancario de la SBP (sbp_series.csv)."
  nota_periodo: "Dato mensual de {periodo} (series de 2024), no del mes de la noticia."

# E1-09 · contextualización con el Banco Mundial (src/contexto.py). Todo dato del Banco Mundial es ANUAL.
tendencia_anios: 5                  # PDF/spec E1-09: tendencia = últimos 5 años de Panamá (nulos siguen nulos)
indicadores_solo_contexto: [SP.POP.TOTL]   # la población nunca se vincula sola (spec E1-09)
palabras_prohibidas: [actual, actuales, actualmente, actualidad]       # ningún texto de salida puede decir "actual" (T04): el dato es anual
notas:                              # se agregan a la limitación de cada dato
  ultimo_anio: "Dato anual de {anio}; último año disponible con valor de Panamá; puede revisarse."
  serie: "Dato anual de {anio}, parte de la tendencia de {n} años de Panamá; puede revisarse."
  anios_sin_valor: "Sin valor en la fuente para: {anios}."

# Cifra propia del titular frente a la oficial (spec E1-09). Conservador: solo %, solo indicadores cuyo
# porcentaje del titular mide lo mismo que el oficial, y la cifra debe seguir de cerca a la palabra clave.
cifra_titular:
  patron_numero: '([-−]?\d+(?:[.,]\d+)?)\s?%'
  patron_anio: '(?<!\d)(20\d{2})(?!\d)'
  # Palabras que rodean la cifra (todas en minúsculas; se buscan entre la palabra clave y la cifra, sin distinguir mayúsculas).
  palabras_de_baja: [cae, cayó, cayo, caída, caida, retrocede, retrocedió, contrae, contrajo, contracción, contraccion, disminuye, disminuyó, desciende, descendió, decrece, decreció, reduce, redujo, se hunde, bajó]   # verbos de baja inequívocos: sin «a», la cifra es una variación negativa
  palabras_de_baja_ambiguas: [baja]   # «baja» es verbo o adjetivo: solo vale como cambio si le sigue «a»/«hasta»; si no, no se compara
  palabras_de_alza: [sube, subió, aumenta, aumentó, crece, creció, avanza, avanzó, repunta, repuntó, se eleva, se elevó]
  palabras_de_nivel: [a, al, hasta]   # verbo de cambio + una de estas = nivel alcanzado: la cifra conserva su signo («al» = a + el)
  palabras_de_cota: [bajo, sobre, menos de, menos del, más de, más del, mas de, mas del, cerca de, cerca del, alrededor de, alrededor del, casi, al menos, unos, unas, aproximadamente, hasta]   # aproximación o cota: no se compara
  palabras_de_proyeccion: [podría, podrían, prevé, prevén, proyecta, proyectan, estima, estiman, pronostica, pronostican, anticipa, espera]   # proyección o pronóstico (en cualquier lugar del titular): no es un dato observado, no se compara
  patrones_de_verbo_no_listado: ['\w+(?:ría|rían|rá|rán)', '\w{2,}(?:ar|er|ir)', 'se\s+\w+']   # entre la palabra clave y la cifra: futuro/condicional, infinitivo o verbo reflexivo fuera de las listas; el signo es incierto, no se compara
  indicadores_de_variacion: [NY.GDP.MKTP.KD.ZG]   # el indicador oficial ya es una tasa de cambio: «cae 2 %» = -2; en los demás, una variación no se compara con el nivel oficial
  ventana_caracteres: 40            # máximo de caracteres (sin cifras ni %) entre la palabra clave y la cifra (supuesto)
  palabras_clave:
    NY.GDP.MKTP.KD.ZG: [pib, producto interno bruto, crecimiento económico]
    FP.CPI.TOTL.ZG: [inflación, inflacion]
    SL.UEM.TOTL.ZS: [desempleo, desocupación]
  etiquetas:
    discrepancia: "posible discrepancia, verificar"
    periodo_distinto: "período distinto, no comparable"
    coincide: "cifra coincidente con la oficial"

# D-125 · reglas internas de vínculo (reemplazan los vínculos por subtema). Una regla se dispara si el tema del grupo es `tema` y
# algún titular del grupo contiene un término de `terminos` (palabra completa, sin distinguir mayúsculas ni acentos; los términos
# de varias palabras admiten cualquier espacio entre ellas) o coincide con un patrón de `patrones` (expresión regular sobre texto
# sin tildes ni mayúsculas), y ningún titular tiene un marcador de `exclusiones` en ese caso. Si se disparan dos o más reglas del
# mismo tema, el vínculo es ambiguo y no se elige ninguno (`candidatos_ambiguos`). Los términos salen de las listas de D-92/E1-10c
# (X41, X53), conservadas al migrar los subtemas: «precio(s)» suelto no (confirmaría un vínculo con el IPC para «precio del cobre»),
# «banco» suelto no (nombra al Banco Mundial y al BID, que no son la banca panameña).
reglas_vinculo:
  pib:
    tema: economia
    terminos: [pib, producto interno bruto, crecimiento economico]
    fuente: indicador
    id: NY.GDP.MKTP.KD.ZG
    relacion: directa
    limitacion: "Dato anual; no describe un trimestre ni un mes concreto."
  inflacion:
    tema: economia
    terminos: [inflacion, ipc, indice de precios, costo de la vida, canasta basica, precio del combustible,
               precio de los combustibles, precios del combustible, precios de los combustibles]
    fuente: indicador
    id: FP.CPI.TOTL.ZG
    relacion: directa
    limitacion: "Dato anual de inflación al consumidor; no es el precio de un producto concreto."
  empleo:
    tema: economia
    terminos: [empleo, empleos, desempleo]
    fuente: indicador
    id: SL.UEM.TOTL.ZS
    relacion: directa
    limitacion: "Dato anual de desempleo; el último año suele revisarse."
  comercio_exterior:
    tema: economia
    terminos: [comercio exterior, exportacion, exportaciones, importacion, importaciones]
    fuente: indicador
    id: NE.EXP.GNFS.ZS
    relacion: directa
    limitacion: "Exportaciones de bienes y servicios como % del PIB, anual; no desglosa por producto."
  telecomunicaciones:
    tema: servicios_publicos
    terminos: [telecomunicacion, telecomunicaciones, internet]
    fuente: indicador
    id: IT.NET.USER.ZS
    relacion: directa
    limitacion: "Uso de internet como % de la población, anual; no mide la falla puntual."
  # D-127: `sismos` NO lleva tema. Un término sísmico literal en el titular es la evidencia que sustenta el contexto de USGS, sea cual sea el
  # tema del grupo (el reto solo exige que la relación esté sustentada y que USGS se use solo para hechos sísmicos). Una regla sin tema no
  # compite con las del tema (no hay ambigüedad): suma su contexto aparte, y nunca es el vínculo principal.
  sismos:
    terminos: [sismo, sismos, sismico, sismica, temblor, temblores, terremoto]
    fuente: usgs
    relacion: evento
    limitacion: "La caja de USGS no es Panamá: mostrar siempre el place original; solo sirve para hechos sísmicos."
  # E3-02 (X89): morosidad y provisiones del sistema bancario como CONTEXTO de la banca. `indirecta` porque las series no miden una
  # calificación de riesgo: no cuentan como dato oficial en E ni en el estado de evidencia, pero la ficha las muestra.
  banca:
    tema: economia
    terminos: [banca, bancos, bancario, bancaria, sistema bancario, calificacion de riesgo, calificadora, calificadoras,
               grado de inversion]
    fuente: sbp
    relacion: indirecta
    limitacion: "Series agregadas del sistema bancario; no describen una entidad ni un cliente, ni miden una calificación de riesgo ni una pérdida."

  # D-127: el vínculo por tema (todo grupo de logística recibía las exportaciones) se retiró: forzaba la relación con la ley del
  # presupuesto del Canal, la muerte de un capitán de remolcador o el GNL de EE. UU. Ahora la logística se vincula con las
  # exportaciones solo si un titular habla de exportaciones, comercio exterior o carga en contenedores (TEU). «Canal» y «carga» sueltos
  # NO son evidencia: «carga» es todo el tema de Logística/Canal (guia_temas.md) y no distingue exportaciones de importaciones o de tránsito.
  exportaciones_logistica:
    tema: logistica
    terminos: [exportacion, exportaciones, comercio exterior, contenedor, contenedores, contenerizada, contenerizadas, contenerizado, teu, teus]
    fuente: indicador
    id: NE.EXP.GNFS.ZS
    relacion: indirecta
    limitacion: "No mide tránsitos ni carga; es solo el contexto de exportaciones como % del PIB, anual."
