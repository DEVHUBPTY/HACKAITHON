# Vínculos con evidencia oficial (etapa 3), tal como el diseño de solución "Vínculos con evidencia oficial".
# Un vínculo es CONTEXTO, nunca prueba de causa ni suma a I (D-15). Los indicadores deben existir en config/fuentes.yaml.
# Los subtemas y temas que no aparecen aquí quedan sin dato con el motivo `motivo_por_defecto`.
version: "1.0"

tipos_relacion:
  directa: "El indicador mide lo mismo que el subtema."
  indirecta: "El indicador es un contexto lejano del tema; no mide el hecho."
  evento: "Evento oficial (USGS) que puede coincidir en el tiempo con la noticia."

motivos_sin_vinculo: [tema_sin_indicador, sin_dato_en_periodo, sin_evento_coincidente, fuera_de_cobertura, candidatos_ambiguos]
motivo_por_defecto: tema_sin_indicador

ventana_coincidencia_dias: 2        # sismos: ± días entre evento USGS y noticia (supuesto)
pais_por_defecto: PAN

subtema:                            # D-92 (enmienda a E1-09) y E1-10c (X41): el subtema del grupo exige sustento
  # Criterios que aceptan el subtema más cercano, en orden. E1-10c (X41) quitó `margen`: con un solo prototipo por
  # subtema, el margen medía el parecido con palabras sueltas del prototipo («obras», «La Chorrera», «CSS») y aceptaba
  # subtemas que el titular no nombra (MOP → agua potable; aprehensión de un exdirector de la CSS → salud pública).
  criterios: [lexico]
  margen_minimo: 0.015              # D-92, sin efecto mientras `margen` no esté en `criterios`; docs/parametros.md
  # Apoyo léxico (D-92, E1-10c): si algún titular del grupo contiene uno de estos términos, el subtema más cercano se
  # acepta. Si un titular contiene un término de OTRO subtema del mismo tema, el subtema es ambiguo y no se afirma.
  # Palabra completa, sin distinguir mayúsculas ni acentos (los términos de varias palabras admiten cualquier espacio
  # entre ellas). Salen de las definiciones de docs/guia_temas.md (columna "Incluye", los paréntesis de salud, educación
  # y seguridad y las reglas de frontera) y de las formas léxicas directas de esas palabras; seguridad ciudadana agrega
  # los nombres de los delitos y actos de un operativo (aprehensión, detención, reclusión) que la guía incluye en él.
  # Todo subtema del catálogo tiene lista: sin término no hay subtema (alcance neutro de I).
  terminos_por_subtema:
    crecimiento_pib: [pib, producto interno bruto, crecimiento economico]
    # «precio(s)» suelto no es un término (confirmaría un vínculo directo con el IPC para «precio del cobre»): solo frases
    # que nombran la inflación o los precios que la guía incluye en el subtema (canasta básica, combustibles).
    inflacion_precios: [inflacion, ipc, indice de precios, costo de la vida, canasta basica, precio del combustible,
                        precio de los combustibles, precios del combustible, precios de los combustibles]
    empleo: [empleo, empleos, desempleo]
    comercio_exterior: [comercio exterior, exportacion, exportaciones, importacion, importaciones]
    telecomunicaciones: [telecomunicacion, telecomunicaciones, internet]
    sismos: [sismo, sismos, sismico, sismica, temblor, temblores, terremoto]
    # E1-10c (X41): los demás subtemas del catálogo (antes solo usaban el margen).
    finanzas_publicas: [finanzas publicas, deuda publica, deuda, presupuesto, presupuestos, presupuestario, recaudacion,
                        deficit fiscal]
    inversion: [inversion, inversiones, inversion extranjera, inversionista, inversionistas]
    # «banco» suelto no: nombra al Banco Mundial y al BID, que no son la banca panameña.
    banca_calificaciones: [banca, bancos, bancario, bancaria, sistema bancario, calificacion de riesgo, calificadora,
                           calificadoras, grado de inversion]
    operacion_canal: [transito, transitos, calado, lago gatun, esclusas]
    puertos: [puerto, puertos, portuario, portuaria, portuarios]
    zona_libre: [zona libre, zona libre de colon]
    carga_aerea: [carga aerea]
    transporte_carga: [transporte de carga, transportistas de carga]
    cadenas_suministro: [cadena de suministro, cadenas de suministro]
    llegada_visitantes: [visitante, visitantes, turista, turistas]
    cruceros: [crucero, cruceros]
    hoteleria: [hotel, hoteles, hotelero, hotelera, hoteleria, ocupacion hotelera]
    aviacion_pasajeros: [vuelo, vuelos, aerolinea, aerolineas, pasajeros, conectividad aerea, ruta aerea, rutas aereas]
    destinos_promocion: [destino turistico, destinos turisticos, promocion turistica]
    # X53: «agua» suelta no (el agua de una crecida no es el servicio): solo frases que nombran el suministro.
    agua_potable: [agua potable, sin agua, suministro de agua, servicio de agua, corte de agua, cortes de agua, idaan, acueducto,
                   potabilizadora]
    # «luz» suelta no («dar a luz», «salir a la luz»): solo frases que nombran el servicio.
    electricidad: [electricidad, energia electrica, apagon, apagones, sin luz, corte de luz, cortes de luz, tarifa electrica]
    transporte_publico: [transporte publico, metro, mibus, metrobus, autobus, autobuses, buses]
    recoleccion_basura: [basura, recoleccion de basura, desechos, residuos solidos, relleno sanitario]
    salud_publica: [salud publica, hospital, hospitales, hospitalario, hospitalaria, css, caja de seguro social, minsa,
                    ministerio de salud, medicamento, medicamentos]
    # «clase» suelta no («clase media»): solo el plural de la guía («sin clases»).
    educacion_publica: [educacion publica, escuela, escuelas, escolar, escolares, colegio, colegios, clases, docente,
                        docentes, meduca, ministerio de educacion]
    seguridad_ciudadana: [seguridad ciudadana, policia, policias, policial, policiales, operativo, operativos, carcel,
                          carceles, carcelario, penitenciario, centro penitenciario, prision, recluso, reclusos, recluido,
                          recluida, privado de libertad, privados de libertad, delito, delitos, delincuencia, delincuente,
                          delincuentes, homicidio, homicidios, asesinato, asesinatos, asesinan, asesinado, asesinada,
                          robo, robos, asalto, asaltos, asaltan, hurto, aprehension, aprehenden, aprehendido, aprehendida,
                          aprehendidos, detenido, detenida, detenidos, droga, drogas, narcotrafico]
    # E1-07c (D-111): «obra(s)» suelta no (obra de teatro, obra social) y «sobrecosto» suelto no (puede ser de una compra):
    # solo las frases que nombran la obra pública. «acueducto» solo, o con Idaan, sigue siendo agua potable (el servicio);
    # la obra de construcción del acueducto es obras públicas (la coincidencia más larga manda, X53).
    obras_publicas: [obra publica, obras publicas, ministerio de obras publicas, mop, obra vial, obras viales, infraestructura vial,
                     carretera, carreteras, autopista, autopistas, puente, puentes, sobrecosto de obra, sobrecostos de obra,
                     sobrecosto en obra, sobrecostos en obras, sobrecostos en obra, sobrecosto en obras, sobrecosto de obras,
                     sobrecostos de obras, licitacion de obra, licitacion de obras, contrato de obra, contratos de obra,
                     obra de acueducto, obras de acueducto, construccion de acueducto, construccion de acueductos]
    inundaciones_lluvias: [inundacion, inundaciones, inundado, inundados, lluvia, lluvias, aguacero, aguaceros, crecida,
                           desbordamiento]
    deslizamientos: [deslizamiento, deslizamientos, derrumbe, derrumbes, alud]
    sequia_nino: [sequia, sequias, el nino, la nina, fenomeno de el nino]   # X53: «seca» no está en la guía
    incendios_forestales: [incendio forestal, incendios forestales]
    # X53: «alerta» suelta no («Minsa enciende alertas»): solo Protección Civil o una alerta con su color.
    alertas_proteccion_civil: [sinaproc, proteccion civil, alerta verde, alerta amarilla, alerta naranja, alerta roja,
                               aviso de prevencion]
    # X53: «ley» suelta no («cumplir la ley de tránsito»): solo una norma en trámite o promulgada.
    leyes_decretos: [leyes, decreto, decretos, decreto ejecutivo, proyecto de ley, anteproyecto de ley, nueva ley,
                     sanciona la ley, aprueba la ley, gaceta oficial]
    resoluciones_entes: [resolucion, resoluciones, ente regulador, regulador, asep, superintendencia]
    reformas: [reforma, reformas]
    listas_internacionales: [lista gris, listas grises, lista negra, listas negras, gafi, lista fiscal, paraisos fiscales]
    contratos_concesiones: [contrato, contratos, concesion, concesiones, licitacion, licitaciones]
    sanciones: [sancion, sanciones, multa, multas, sancionado, sancionada]
  # E1-07c (X77): la obra del acueducto (construir, ampliar, rehabilitar, uno nuevo) es obras públicas (docs/guia_temas.md); el
  # servicio («Idaan repara el acueducto») sigue siendo agua potable porque el término suelto «acueducto» es más corto y pierde.
  # Expresiones regulares sobre texto sin tildes ni mayúsculas.
  patrones_por_subtema:
    obras_publicas:
      - '(?<!\w)(?:(?:construccion|ampliacion|rehabilitacion|remodelacion|obras?)\s+(?:de|del)\s+(?:(?:un|el|los)\s+)?(?:nuevo\s+)?|nuevos?\s+)acueductos?(?!\w)'
  # E1-07c (X78, D-111): el proceso judicial por corrupción NO es obras públicas (ni subtema de justicia: la nota es otro asunto).
  # Un titular con alguno de estos marcadores (palabra o frase completa, sin tildes) no respalda el subtema; no se vuelve ruido.
  exclusiones_por_subtema:
    obras_publicas: [imputa, imputan, imputacion, imputaciones, imputado, imputados, imputada, juez, jueza, jueces, fiscalia,
                     tribunal, magistrado, audiencia, juicio, condena, condenan, condenado, condenados, peculado, corrupcion,
                     detienen a, detenido por, detenidos por, aprehenden a, aprehendido por, prision preventiva, acusan a]

sismos:                             # E1-09b: presentación y textos fijos del vínculo con eventos USGS
  zona_horaria: America/Panama      # solo para mostrar; los datos siguen en UTC
  formato_hora: "%Y-%m-%d %H:%M"
  formato_hora_utc: "%Y-%m-%dT%H:%M:%SZ"   # ISO 8601 UTC de los datos
  decimales_horas: 2                # precisión de la diferencia en horas entre noticia y evento
  unidad_magnitud: "magnitud"       # unidad de la columna `valor` en `vinculos` (USGS no la fija en nuestro contrato)
  plantilla_regla: "Evento USGS a ± {dias} días de la noticia y magnitud mínima {magnitud_minima}."
  nota_fecha_deteccion: "Alguna noticia del grupo no tiene fecha de publicación: se usó su fecha de detección."
  limitaciones:
    - "El lugar puede estar fuera de territorio panameño: se muestra tal como lo da USGS."
    - "La fuente solo describe el evento sísmico; no informa daños ni pérdidas."
    - "Un evento con estado automático puede cambiar al ser revisado."

# E1-09 · contextualización con el Banco Mundial (src/contexto.py). Todo dato del Banco Mundial es ANUAL.
tendencia_anios: 5                  # PDF/spec E1-09: tendencia = últimos 5 años de Panamá (nulos siguen nulos)
indicadores_solo_contexto: [SP.POP.TOTL]   # la población nunca se vincula sola (spec E1-09)
palabras_prohibidas: [actual, actuales, actualmente, actualidad]       # ningún texto de salida puede decir "actual" (T04): el dato es anual
notas:                              # se agregan a la limitación de cada dato
  ultimo_anio: "Dato anual de {anio}; último año disponible con valor de Panamá; puede revisarse."
  serie: "Dato anual de {anio}, parte de la tendencia de {n} años de Panamá; puede revisarse."
  anios_sin_valor: "Sin valor en la fuente para: {anios}."

# Cifra propia del titular frente a la oficial (spec E1-09). Conservador: solo %, solo indicadores cuyo
# porcentaje del titular mide lo mismo que el oficial, y la cifra debe seguir de cerca a la palabra clave.
cifra_titular:
  patron_numero: '([-−]?\d+(?:[.,]\d+)?)\s?%'
  patron_anio: '(?<!\d)(20\d{2})(?!\d)'
  # Palabras que rodean la cifra (todas en minúsculas; se buscan entre la palabra clave y la cifra, sin distinguir mayúsculas).
  palabras_de_baja: [cae, cayó, cayo, caída, caida, retrocede, retrocedió, contrae, contrajo, contracción, contraccion, disminuye, disminuyó, desciende, descendió, decrece, decreció, reduce, redujo, se hunde, bajó]   # verbos de baja inequívocos: sin «a», la cifra es una variación negativa
  palabras_de_baja_ambiguas: [baja]   # «baja» es verbo o adjetivo: solo vale como cambio si le sigue «a»/«hasta»; si no, no se compara
  palabras_de_alza: [sube, subió, aumenta, aumentó, crece, creció, avanza, avanzó, repunta, repuntó, se eleva, se elevó]
  palabras_de_nivel: [a, al, hasta]   # verbo de cambio + una de estas = nivel alcanzado: la cifra conserva su signo («al» = a + el)
  palabras_de_cota: [bajo, sobre, menos de, menos del, más de, más del, mas de, mas del, cerca de, cerca del, alrededor de, alrededor del, casi, al menos, unos, unas, aproximadamente, hasta]   # aproximación o cota: no se compara
  palabras_de_proyeccion: [podría, podrían, prevé, prevén, proyecta, proyectan, estima, estiman, pronostica, pronostican, anticipa, espera]   # proyección o pronóstico (en cualquier lugar del titular): no es un dato observado, no se compara
  patrones_de_verbo_no_listado: ['\w+(?:ría|rían|rá|rán)', '\w{2,}(?:ar|er|ir)', 'se\s+\w+']   # entre la palabra clave y la cifra: futuro/condicional, infinitivo o verbo reflexivo fuera de las listas; el signo es incierto, no se compara
  indicadores_de_variacion: [NY.GDP.MKTP.KD.ZG]   # el indicador oficial ya es una tasa de cambio: «cae 2 %» = -2; en los demás, una variación no se compara con el nivel oficial
  ventana_caracteres: 40            # máximo de caracteres (sin cifras ni %) entre la palabra clave y la cifra (supuesto)
  palabras_clave:
    NY.GDP.MKTP.KD.ZG: [pib, producto interno bruto, crecimiento económico]
    FP.CPI.TOTL.ZG: [inflación, inflacion]
    SL.UEM.TOTL.ZS: [desempleo, desocupación]
  etiquetas:
    discrepancia: "posible discrepancia, verificar"
    periodo_distinto: "período distinto, no comparable"
    coincide: "cifra coincidente con la oficial"

vinculos:                           # por subtema
  crecimiento_pib:
    fuente: indicador
    id: NY.GDP.MKTP.KD.ZG
    relacion: directa
    limitacion: "Dato anual; no describe un trimestre ni un mes concreto."
  inflacion_precios:
    fuente: indicador
    id: FP.CPI.TOTL.ZG
    relacion: directa
    limitacion: "Dato anual de inflación al consumidor; no es el precio de un producto concreto."
  empleo:
    fuente: indicador
    id: SL.UEM.TOTL.ZS
    relacion: directa
    limitacion: "Dato anual de desempleo; el último año suele revisarse."
  comercio_exterior:
    fuente: indicador
    id: NE.EXP.GNFS.ZS
    relacion: directa
    limitacion: "Exportaciones de bienes y servicios como % del PIB, anual; no desglosa por producto."
  telecomunicaciones:
    fuente: indicador
    id: IT.NET.USER.ZS
    relacion: directa
    limitacion: "Uso de internet como % de la población, anual; no mide la falla puntual."
  sismos:
    fuente: usgs
    relacion: evento
    limitacion: "La caja de USGS no es Panamá: mostrar siempre el place original; solo sirve para hechos sísmicos."

vinculos_por_tema:                  # cualquier subtema del tema
  logistica:
    fuente: indicador
    id: NE.EXP.GNFS.ZS
    relacion: indirecta
    limitacion: "No mide tránsitos ni carga; es solo el contexto de exportaciones como % del PIB, anual."
