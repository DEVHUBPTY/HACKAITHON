[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "~3.11"
pandas = "^3.0.6"
pandera = "^0.34.1"
duckdb = "^1.5.6"
numpy = "<2.5"
sentence-transformers = "^6.1.0"
scikit-learn = "^1.9.1"
pydantic = "^2.13.5"
pyyaml = "^6.0.3"
jinja2 = "^3.1.6"
streamlit = "^1.65.0"
requests = "^2.34.2"
feedparser = "^6.0.14"
ollama = "^0.6.3"
rank-bm25 = "^0.2.2"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
