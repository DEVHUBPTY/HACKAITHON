[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "~3.11"
pandas = "^3.0.6"
pandera = "^0.34.1"
duckdb = "^1.5.6"
numpy = "<2.5"
sentence-transformers = "^6.1.0"
scikit-learn = "^1.9.1"
pydantic = "^2.13.5"
pyyaml = "^6.0.3"
jinja2 = "^3.1.6"
streamlit = "^1.65.0"
requests = "^2.34.2"
feedparser = "^6.0.14"
ollama = "^0.6.3"
rank-bm25 = "^0.2.2"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "t01: prueba de aceptación T01 (PDF sección 9)",
  "t02: prueba de aceptación T02 (PDF sección 9)",
  "t03: prueba de aceptación T03 (PDF sección 9)",
  "t04: prueba de aceptación T04 (PDF sección 9)",
  "t05: prueba de aceptación T05 (PDF sección 9)",
  "t06: prueba de aceptación T06 (PDF sección 9)",
  "t07: prueba de aceptación T07 (PDF sección 9)",
  "t08: prueba de aceptación T08 (PDF sección 9)",
  "t09: prueba de aceptación T09 (PDF sección 9)",
  "t10: prueba de aceptación T10 (PDF sección 9)",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
