# E1-15: la demo corre sin red; sin telemetría de uso y sin abrir el navegador por su cuenta.
[browser]
gatherUsageStats = false

[server]
headless = true
address = "localhost"          # sin consulta de IP pública al arrancar (la demo corre sin red)
fileWatcherType = "none"

# D-131: tema claro y editorial; los colores deben coincidir con `estilo` de config/interfaz.yaml (lo vigila una prueba).
# Fuente del sistema: ningún recurso externo (la demo corre sin red).
[theme]
base = "light"
primaryColor = "#0E7C86"
backgroundColor = "#F6F7F9"
secondaryBackgroundColor = "#E8ECF1"
textColor = "#1B2A41"
font = "sans-serif"
